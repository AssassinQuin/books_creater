name: echo
display_name: 回响
db_table: echoes
id_field: id
file_dir: "设定/大纲"
authority: db
merge_mode: section_replace
section_marker: "## echo: {id}"
file_pattern: "回响清单.md"
file_title: "回响清单"
header_template: "# 回响清单"
skip_existing: false

sections:
  - heading: "echo: {id}"
    type: fields
    fields:
      - column: source_event
      - column: echo_type
      - column: echo_description
      - column: strong_related
        type: int
      - column: source_chapter_id
        md_key: source_chapter
        transform: resolve_chapter_number
      - column: echo_chapter_id
        md_key: echo_chapter
        transform: resolve_chapter_number
      - column: tags
        type: list

file_to_db:
  enabled: true
