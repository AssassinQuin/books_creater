name: volume_analysis
display_name: 卷级分析
authority: file

db_table: volumes
id_field: number
order_by: "number ASC"

file_dir: "设定/大纲"
file_pattern: "V{number}-分析.md"
merge_mode: overwrite
skip_existing: true
header_template: "# V{number} 分析"

sections:
  - heading: 下卷衔接
    type: table
    table_column: next_volume_bridge

  - heading: 人物弧光
    type: table
    table_column: character_arcs

  - heading: 人物互动矩阵
    type: table
    table_column: interaction_matrix

  - heading: 不做的
    type: table
    table_column: boundaries

  - heading: 悬念锚点
    type: jsonb
    jsonb_column: suspense_anchors

  - heading: 核心对话锚点
    type: table
    table_column: key_dialogues

  - heading: 写作优先级
    type: jsonb
    jsonb_column: writing_priorities

  - heading: 硬约束自检
    type: jsonb
    jsonb_column: hard_constraints

  - heading: 信息投放节奏
    type: table
    table_column: info_pacing

  - heading: 节奏分配
    type: table
    table_column: rhythm_allocation

file_to_db:
  enabled: true
