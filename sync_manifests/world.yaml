name: world
display_name: 世界观
authority: db

db_table: world_settings
id_field: name
composite_id_fields: [category, name]
order_by: "category, name"

file_dir: "设定/世界观"
file_pattern: "{category_file}.md"
merge_mode: section_replace
section_marker: "## {category}: {name}"

category_file_map:
  core_setting: "核心设定/"
  bestiary: "异灵/"
  ability: "能力/"
  item: "物品/"
  location: "地点/"
  faction: "势力/"
  economy: "经济体系/"
  daily_life: "日常生活/"
  history: "历史事件/"
  race: "种族/"
  building: "建筑/"
  culture: "文化/"
  plant: "植物/"

sections:
  - heading: "{category}: {name}"
    type: fields
    fields:
      - column: keys
        optional: true
      - column: secondary_keys
        optional: true
      - column: tags
        optional: true
      - column: related_ids
        md_key: related
        optional: true
      - column: region
        optional: true
      - column: volume_range
        optional: true
      - column: faction_id
        optional: true
      - column: writing_guide
        optional: true
      - column: priority
        optional: true
        condition: null
      - column: is_constant
        type: bool
        optional: true
      - column: first_appearance_chapter
        md_key: 首次出场
        type: int
        optional: true
  - heading: 详细内容
    type: jsonb
    jsonb_column: data
    jsonb_key: content
    condition: always

file_to_db:
  enabled: true
