name: character
display_name: 人物
db_table: characters
id_field: name
file_dir: "设定/人物"
authority: db
merge_mode: overwrite
file_pattern: "{name}.md"
file_title: "{name}"
header_template: "# {name}"
skip_existing: false
transforms:
  faction_id: builtin.resolve_faction
  first_appearance_chapter: builtin.resolve_chapter_number

sections:
  - heading: 基本信息
    type: fields
    fields:
      - column: role
      - column: race
      - column: ability_level
      - column: faction_id
        md_key: faction
        transform: resolve_faction

  - heading: 外观与性格
    type: fields
    fields:
      - column: appearance
      - column: personality
      - column: speech_style
      - column: catchphrase

  - heading: 背景与动机
    type: fields
    fields:
      - column: background
      - column: goals
      - column: weaknesses

  - heading: 弧线
    type: fields
    fields:
      - column: arc_notes
      - column: first_appearance_chapter
        md_key: first_appearance
        transform: resolve_chapter_number
      - column: status
        type: jsonb
      - column: is_active
        md_key: distillation_tracked

  - heading: 外观描写库
    type: jsonb
    jsonb_column: appearance_detail
    title_key: name

  - heading: 决策引擎
    type: jsonb
    jsonb_column: decision_engine
    title_key: name

  - heading: 对话声音指纹
    type: jsonb
    jsonb_column: voice_fingerprint
    title_key: name

  - heading: 能力体系
    type: jsonb
    jsonb_column: ability_system
    title_key: name

  - heading: 行为模式
    type: jsonb
    jsonb_column: behavior_pattern
    title_key: name

  - heading: 当前快照（终局）
    type: jsonb
    jsonb_column: current_snapshot
    title_key: name

  - heading: 成长轨迹
    type: jsonb
    jsonb_column: growth_trajectory
    title_key: name

  - heading: 动态追踪（不在此文件维护）
    type: static
    static_content: |
      > 人物动态状态见 DB：
      > - `character_state_snapshots` — 每章状态快照
      > - `character_distillation_evolution` — 蒸馏模型演化记录
      >
      > 文件只保留静态档案，动态内容通过 MCP 工具查询。

relations:
  sql: |
    SELECT cr.relation_type, cr.description, cr.intensity,
           cr.subtext_design, cr.dialogue_adjustment,
           c1.name AS from_name, c2.name AS to_name
    FROM character_relations cr
    JOIN characters c1 ON cr.from_character_id = c1.id
    JOIN characters c2 ON cr.to_character_id = c2.id
    WHERE cr.novel_id = ? AND (cr.from_character_id = ? OR cr.to_character_id = ?)
    ORDER BY cr.intensity DESC
  param_columns: [novel_id, id, id]
  heading: 关系

file_to_db:
  enabled: true
