name: character
display_name: 人物
authority: db
skip_existing: true

db_table: characters
id_field: name
query_extra: "AND is_active = 1"
order_by: "name ASC"

file_dir: "设定/人物"
file_pattern: "{name}.md"
merge_mode: overwrite
header_template: "# {name}"

sections:
  - heading: 基本信息
    type: fields
    fields:
      - column: role
        optional: false
      - column: race
        optional: true
      - column: ability_level
        optional: true
      - column: faction_id
        md_key: faction
        transform: resolve_faction
        optional: true

  - heading: 外观与性格
    type: fields
    fields:
      - column: appearance
        optional: false
      - column: personality
        optional: false
      - column: speech_style
        optional: false
      - column: catchphrase
        optional: true

  - heading: 背景与动机
    type: fields
    fields:
      - column: background
        optional: false
      - column: goals
        optional: false
      - column: weaknesses
        optional: false

  - heading: 弧线
    type: fields
    fields:
      - column: arc_notes
        optional: false
      - column: first_appearance_chapter
        type: int
        optional: false

relations:
  heading: 关系
  sql: |
    SELECT cr.relation_type, cr.description, cr.intensity,
           c1.name as from_name, c2.name as to_name,
           cr.subtext_design
    FROM character_relations cr
    JOIN characters c1 ON cr.from_character_id = c1.id
    JOIN characters c2 ON cr.to_character_id = c2.id
    WHERE cr.novel_id = ?
      AND (cr.from_character_id = ? OR cr.to_character_id = ?)
      AND cr.status = 'active'
    ORDER BY cr.intensity DESC
  param_columns: [novel_id, id, id]

transforms:
  resolve_faction: builtin.resolve_faction

file_to_db:
  enabled: true
