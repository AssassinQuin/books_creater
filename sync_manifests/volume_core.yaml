name: volume_core
display_name: 卷级核心
authority: file

db_table: volumes
id_field: number
order_by: "number ASC"

file_dir: "设定/大纲"
file_pattern: "V{number}-{title}.md"
merge_mode: overwrite
skip_existing: true
header_template: "# V{number}：{title}"

sections:
  - heading: 卷级信息
    type: fields
    fields:
      - column: number
        type: int
        optional: false
      - column: title
        optional: false
      - column: main_plotlines
        type: list
        optional: true

  - heading: 元信息
    type: blockquote
    blockquotes:
      - column: core_emotion
        label: 核心情绪
      - column: pov_anchor
        label: POV锚点
      - column: time_span
        label: 时间跨度
      - column: voice_mapping
        label: 声音适配
      - column: world_state
        label: 世界状态

  - heading: 卷级因果链
    type: raw
    raw_column: causal_chain

  - heading: 故事脉络
    type: acts
    acts:
      - ["起", act_intro]
      - ["承", act_rise]
      - ["转", act_twist]
      - ["合", act_resolution]

  - heading: 备注
    type: raw
    raw_column: notes

file_to_db:
  enabled: true
