name: foreshadow
display_name: 伏笔
db_table: foreshadows
id_field: id
file_dir: "设定/大纲"
authority: db
merge_mode: section_replace
section_marker: "## foreshadow: {id}"
file_pattern: "伏笔清单.md"
file_title: "伏笔清单"
header_template: "# 伏笔清单"
skip_existing: false

sections:
  - heading: "foreshadow: {id}"
    type: fields
    fields:
      - column: description
      - column: status
      - column: importance
      - column: planted_chapter_id
        md_key: planted_chapter
        transform: resolve_chapter_number
      - column: planned_recall_chapter
        type: int
      - column: actual_recall_chapter_id
        md_key: actual_recall_chapter
        transform: resolve_chapter_number
      - column: related_characters
        type: list
      - column: tags
        type: list
      - column: clue_type
      - column: reveal_strategy
      - column: related_foreshadows
        type: list

file_to_db:
  enabled: true
