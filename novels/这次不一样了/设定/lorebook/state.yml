# Lorebook 同步状态追踪
# 此文件记录各数据源的最后同步时间和内容哈希
# 用于检测过期信息和冲突

sync_metadata:
  version: "1.0"
  created_at: "2026-05-14"
  description: "双源同步状态追踪（DB + Lorebook YAML）"

sources:
  db:
    type: "postgresql"
    connection: "postgresql://localhost:5432/fcli"
    last_sync: ""
    status: "pending_initial_sync"
    
  lorebook_yaml:
    type: "yaml_files"
    path: "设定/lorebook/entries"
    last_sync: ""
    status: "pending_initial_sync"
    
  character_deepening:
    type: "markdown"
    path: "设定/角色深化.md"
    last_sync: ""
    status: "pending_initial_sync"
    
  worldview:
    type: "markdown_files"
    path: "设定/世界观"
    last_sync: ""
    status: "pending_initial_sync"
    
  locked_rules:
    type: "markdown"
    path: "设定/锁定设定.md"
    last_sync: ""
    status: "pending_initial_sync"

entry_hashes:
  # 格式: entry_id: hash
  # 示例:
  # LB-0001: "a1b2c3d4"
  # LB-0002: "e5f6g7h8"

conflict_history:
  # 记录历史冲突和裁决结果
  # 格式:
  # - date: "2026-05-14"
  #   type: "角色能力冲突"
  #   sources: ["DB:character#1", "lorebook:LB-0001"]
  #   resolution: "以角色深化.md为准"
  #   resolved_by: "manual"
