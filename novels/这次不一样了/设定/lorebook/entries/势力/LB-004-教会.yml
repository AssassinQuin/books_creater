content: |
  教会的独占维度是认知控制——它控制普通人怎么理解灵能、历史和碑文。起源：虞渊活了400年不老，普通人看到"有人不会老"传说自然诞生，自发形成信仰体系。虞渊发现后选择不干预——信仰等于服从等于不用直接管理。教会不是虞渊的工具，是他的影子。

  核心机制：碑文的"官方解读者"——打磨碑文碎片、选择性公布、编成教义。"永恒者将净化一切"从碑文碎片拼出，只是拼错了。教义和虞渊的灵能频率一致（因为虞渊真的存在）所以"验证"也通过，但永恒者的真面目和教义说的完全不同。教会追杀主角团的动机不是"永恒者的敌人"——是主角团发现的碑文真相会摧毁教会的叙事根基，解释权被推翻等于教会崩塌。

  叙事功能是前/中期boss（V5-V12）：V5-V6追杀+持有碑文，V7星火社暴露后教义出现第一道裂痕，V9主导三方追杀，V10禁地边缘碑文对比教会打磨版vs原始版成为物证，V12教义被证伪信徒信仰崩塌后交接给虞渊。虚无主义叠加：V7组织是假的，教义也是假的，双重虚无"那还有什么真的"。

  护教体系三级：护教武士（灰白短袍，基础灵能格斗，数量多个体弱）、巡礼祭司（深灰长袍，低阶灵能感知+治疗）、裁判官（黑袍红色灵能纹路，觉醒者级别私兵，灵枢不知道）。教会不让灵枢知道裁判官存在。
