content: |
  灵枢集团是这个世界唯一的经济垄断体。它控制灵站网络和灵晶流通——去灵站卖灵能是普通人唯一的赚钱路子，灵衰症是灵站系统的累积副作用，和卖血一模一样。灵枢知道但选择隐瞒，"高产出源维护计划"不是关怀是算术题。

  起源：纪元2虞渊暗中引导灵务司朝垄断方向发展，纪元3成熟为灵枢集团。灵枢不是纯粹的恶——是系统惯性，停下来就崩溃。没有人坐在会议室里说"让我们制造疾病"，是灵枢内部有人（钟衍）知道参数在临界线上但只是执行层，高层（韩朗）把灵衰症患者当数据管理。

  灵枢用经济锁生存，教会用信仰锁理解。虞渊同时操控两条链，两套锁链独立运转，互相不知道对方的存在。写灵枢相关场景时要记住：它是"沉默的系统"，不是"恶意的组织"。普通人在灵站排队的画面是真实的，灵站给人的希望感也是真实的——多去几次、多卖几次灵晶、攒够钱去内城，这条路是通的，只是代价被藏起来了。沈野对抗灵枢的动机不是革命，是被逼的——妹妹的治疗数据锁在灵枢手里。
