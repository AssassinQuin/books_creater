content: |
  研究院是中环·自由城的半自治机构，表面独立研究灵衰症，实际受灵枢监控。总部在自由城，边境镇有分部。核心团队分四部：临床部（一线治疗）、病理研究部（林原领导，基础研究）、药物开发部（药方研制）、生物工程部（灵能设备）。写研究院场景时要有实验室的冷色调和精密感，不是疯狂科学家的巢穴，是正常人在做不正常的事。

  内部暗线：陈启明是给方岩传数据的内线，V7暴露后失联，V14确认存活。这条线是方岩获取灵枢内部信息的通道。写暗线传递时要像谍战——信息碎片化、每次只有一张纸条，被发现的恐惧是真实的。

  核心矛盾：研究院有灵衰症的治疗理论，但缺灵枢核心数据——灵枢故意锁着，怕暴露灵站副作用。这把研究院逼到伦理红线边缘。林原的选择是活体实验：用活人获取数据，因为没有其他途径。写林原不是写坏人，是写"被系统逼到墙角的人"。他清楚自己在干什么，也清楚后果——电车难题，只是他选了扳道闸。

  叙事功能：研究院承载全书最核心的伦理困境。每一条治疗方案的背后都有一个道德代价，每一个"突破"都踩在某个人的痛苦上。写研究院场景时要让读者同时理解两方：不做的后果（灵衰症患者继续死）和做的代价（活体实验对象在受苦）。
