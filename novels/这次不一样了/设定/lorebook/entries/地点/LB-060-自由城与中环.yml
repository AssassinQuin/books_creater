content: |
  研究院总部所在地，中环最大的城市，半独立状态（名义上受灵枢管辖，实际研究院自行管理），人口数十万。高砖石城墙约5米高，外层有灵能加固层，阳光下微微发光。城门有研究院的武装人员把守，进出需要查验身份。

  自由城分三级结构：内区（研究院核心设施、灵能研究实验室、高级研究人员居住区，普通人无法进入）、中区（灵能剧院、灵能中继塔、商业街、研究院中层人员居住区）、外区（普通人居住区、市场、旅店，条件比内区差很多但比外环聚落好太多）。灵能剧院是自由城标志性建筑——觉醒者上台表演灵能操控，平民只能站在外围围栏外远远看着，是阶级分化的具象化场景。

  中环其他重要城市：海岸城（东部港口城市，商队贸易枢纽，鱼腥味加灵能味）、边境镇（中环与外环交界，研究院设有分部，是方岩路线的终点站）、铁谷镇（矿区中转站，壁盾军团补给点，矿工和猎人混杂，粗犷但热闹）。

  中环整体末日基调：建筑有灵能风化裂纹（灵能长期侵蚀石材表面形成的细密纹路），灵能公告栏受灵枢审查后只发布"安全"信息，巡逻队走过时普通人让路低头。比外环好太多，但随时能感觉到"这层安宁是脆弱的"。

  写作指导：自由城要写出"知识就是权力"的氛围——研究院的控制方式不是军队而是知识垄断，信息不对称是核心矛盾。中环场景要始终带有"末日余韵"——不是崩溃后的废墟，而是正在缓慢衰败的城市。灵能剧院是阶级场景的绝佳舞台，写平民围观时的渴望和自卑能一石二鸟。
