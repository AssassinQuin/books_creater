content: |
  V1到V2的16站安全路线，方岩用15年斥候生涯一步一步踩出来的。全程约25-30天（含休整），刻意避开灵枢主干道和已知兽潮路径，走北方矿区边缘和西部过渡带的"灰色地带"。

  完整站点：铁锈矿洞→碎岩谷→枯井驿站→黑石梁→风化堡→碎石坡→铁谷镇（休整2天）→矿山隘口→寒松岭→冻湖营地→矿洞群边缘→旧矿工村→灰岩脊→荒原哨站→盐碱荒原→边境镇外围。铁谷镇是全程唯一像样的休整点，有壁盾军团的补给站和几家商铺。边境镇是研究院势力范围，也是旅途终点。

  每站都有旅途互动设计——沈念发烧时方岩给她裹上所有能找到的布，在枯井驿站废弃的水井边过夜；沈野第一次站在碎岩谷的高处看外环全貌，灰绿色的灵能残渣在荒原上像疮疤一样蔓延；风化堡的夜晚方岩讲他年轻时遇到T2的经历，沈野听得攥紧拳头；冻湖营地湖面结冰下面有微弱的灵能光芒脉动，沈念好奇伸手去碰被方岩一把拉回。

  写作指导：旅途16站是V1末到V2初的过渡节奏，每一站都是一个微型叙事单元。不要把旅途写成流水账，每站选一个核心互动+一个环境细节。方岩走路时习惯走在前面探路、回头确认跟上来没有——这个动作重复出现能建立角色节拍。铁谷镇是旅途的"中点喘息"，要写出短暂的安宁感（能洗热水澡、能睡在真正的床上）与即将进入更危险区域的紧张交织。
