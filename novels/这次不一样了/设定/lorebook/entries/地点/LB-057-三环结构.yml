content: |
  以禁地为中心，灵能从核心向外辐射形成三大环带，每环之间有宽阔的过渡带。这不是人为划分的行政区域，而是灵能浓度自然形成的地理现实——越靠近禁地，灵能越浓；越远离禁地，灵能越稀。整个大陆从外环边缘到禁地核心，步行全程约80-100天。

  外环：兽潮前线加资源采集区，灵能最稀薄但兽潮最频繁。没有城墙保护，聚落靠地形和简易陷阱防御。生活在这里的人主要是猎人、拾荒者、矿工和流民，日复一日跟兽潮和贫瘠搏斗。无灵能设施，连灵能通讯都收不到。外环人把去中环叫"进城"，是很多人一辈子的梦想。

  中环：各势力角力的主战场，有城墙、巡逻队、商队往来。灵枢在这里影响力最大但并非绝对——研究院在自由城、壁盾在边境线上、教会在南方密林，都有自己的势力范围。中环城市有灵能基础设施但远不如内环完善，普通人比外环过得好但仍然艰难。

  内环：灵枢核心区，灵能浓度最高，觉醒者密度最大。外人进入需要灵枢发放的通行许可，没有许可会被巡逻队拦截。这里是大陆上最"安全"也最"秩序"的地方，但自由的代价是服从。

  写作指导：三环结构是整个世界观的空间骨架。从外环到内环的移动要体现"阶级跃迁"——每过一道检查站，环境就整洁一层、人也精神一层，但同时压抑感也增加一层。角色从外环到内环的反应是最好的世界观展示窗口：沈野第一次见到内环灵能路灯的反应、沈念第一次呼吸净化空气的反应。不要直接解释三环结构，通过角色的身体感受和观察来呈现。
