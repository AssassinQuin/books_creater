content: |
  沈野的起点，位于外环西部，人口约200人的微型聚落。整体由几十截废弃灵能管道拼成，从外面看就像一堆灰色铁管堆在碎石地上，不走近根本看不出里面住着人。

  管道直径1.5到2米，成年人在里面需要弯腰行走。管道之间的缝隙用碎石和铁皮堵着，顶上搭旧布和铁皮挡雨。没有城墙，只有外围一圈简陋的灵能陷阱（用废旧灵能碎片改装的感应触发装置），入口的管道口用碎石堵了半边，只留一个人侧身通过的宽度。聚落最显眼的是竖在入口处的灵能公告栏——一块旧铁板上焊着黄色预警灯，兽潮来临时会闪烁。

  聚落内部最热闹的地方是老陈的面摊——一口被火烧得发黑的铁锅架在金属板台面上，台面是从废弃灵站拆下来的外壳。老陈的面汤没什么油水，但热乎，是聚落为数不多的温暖来源。周围散落着几条管道分支，像毛细血管一样通向各自的"家"。

  色调为铁锈灰为主，管道接缝处偶尔渗出灵能残渣的灰绿色荧光。气味是烧焦味（到处都是生火的痕迹）+金属味（铁管铁皮）+灵能残渣特有的微甜刺鼻味。声音：风灌进管道的呜咽声、金属膨胀的嘎吱声、远处兽潮的低沉震动。

  写作指导：废墟聚落的核心氛围是"脆弱的温暖"。写这个场景时要体现"人们拼了命才维持住这一点点活着的痕迹"。管道里生活要写出物理上的逼仄感——弯腰、侧身、磕头，每一步都是跟空间较劲。老陈面摊是情绪锚点，所有温暖场景都可以围绕热汤展开。Ch001沈野从聚落出发狩猎、Ch009兽潮来袭，聚落始终是情感参照物。
