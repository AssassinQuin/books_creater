id: LB-043
name: 征召与内城体系
keys: [征召, 服役, 内城, 觉醒, 自主觉醒, 人工觉醒]
secondary_keys: [觉醒费用, 服役期, 边疆, 兽潮, 教会征用, 内城身份, 身份价格, 觉醒测试, 留档]
selective: false
selective_logic: 0
content: |
  觉醒有两种途径，对应两种完全不同的人生。自主觉醒是自然发生的灵能觉醒，不欠任何人，觉醒后是自由身，不需要服役。人工觉醒是通过支付费用进行的人工诱导觉醒，觉醒后必须服役——要么被派往边疆抵御兽潮，要么被教会征用为资产。费用本身就是一个陷阱：穷人付不起，富人不需要去。

  人工觉醒者的服役本质是卖命。低阶觉醒者被派往边疆的概率极高，而外环灵能浓度极低导致他们能力偏弱——拿着被压制的实力去对抗边疆更强的异灵，死亡率惊人。这不是"为国效力"的光荣征召，而是用低阶觉醒者的命去填边疆防线。

  外环但凡有亲人的人不会选择觉醒。原因冰冷而残酷：觉醒=被征召=离开外环去边疆=把亲人留在外环独自面对危险。征召本质上就是一纸判决——判的是亲人的死刑。所以外环有能力潜质的人反而回避觉醒测试，因为一旦测试结果留档，就可能被征召。沈野就是如此：他知道自己有成为觉醒者的潜质，但从不接受正式测试，因为留档意味着可能被强制征召，意味着要离开妹妹。

  内城身份只能由觉醒者购买，价格与能力等级成反比——越弱的觉醒者买内城身份越贵（因为制度希望你用服役来换取，而不是花钱买到），越强的越便宜（高阶觉醒者是稀缺资源，内城需要拉拢）。这制造了一个绝望循环：想活得好→需要内城身份→需要觉醒→需要服役→必须离开亲人。每一步都是理性的，合在一起却是死局。
