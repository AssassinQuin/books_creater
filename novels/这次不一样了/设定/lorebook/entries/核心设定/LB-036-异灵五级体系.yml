selective_logic: 0
content: |
  异灵按智慧和能力水平分为五个等级。T1游荡体（无智慧，本能驱动，群居行为，是最低级最常见的异灵）→T2锐化体（初步智能，功能开始分化，能执行简单战术）→T3特化体（中等智慧，拥有独特能力和明确战术风格，单只就能威胁猎团）→T4统帅体（高智慧，能统领族群、协调作战，被视为区域性威胁）→T5渊（超高智慧，接近文明级别，极为罕见，其存在本身就是世界级事件）。

  异灵是灵能环境下的自然演化产物，并非被封印创造的怪物。封绝之前它们就存在，封印期间灵能衰退导致它们退化，灵能恢复后重新加速进化。这意味着异灵不是"需要被消灭的邪恶"，而是与人类共享这个灵能世界的另一种生命形式。

  灵晶与异灵的关系：异灵体内的凝晶是高灵能环境的自然结果，就像人在高钙环境中骨骼更致密。灵晶品质与异灵等级正相关——T1几乎没有可用灵晶，T4体内可能凝结出稀有品质的灵晶。灵晶是猎杀暴利来源，也是异灵仇恨人类的根源：人类为了灵晶猎杀它们，它们为了生存反击人类，仇恨循环由此开始。

  异灵进化速度和灵能浓度直接相关。灵能浓度越高的区域，异灵进化越快、等级越高。这也解释了为什么越靠近禁地的区域越危险——不只是灵能本身有威胁，而是那里的异灵更强大。
