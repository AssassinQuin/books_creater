id: LB-036
name: 异灵五级体系
keys: [虫豸, 牙, 角, 鳞, 渊, 异灵等级, 游荡体, 锐化体]
secondary_keys: [虫豸, 牙, 角, 鳞, 渊, 等级]
selective: true
selective_logic: 2
content: |
  猎人按危险程度把异灵分了五档。虫豸"虫子"——没有智慧本能驱动群居，最常见最低级。灰蜥、沙穴蚁这些都算。单独遇到不用怕，一群能淹死人。牙"有点脑子"——初步智能，能执行简单战术。灰蜥锐化体会绕到侧面再攻击，矿晶蛛在矿脉结网。体内开始凝晶，一只值一到三银币。角"命钱"——中等智慧，有独特能力，单只威胁整个猎团。伪装蜥能模仿岩石外形，猎物走到面前才扑出来。鳞"别想了"——高智慧，能统领族群调度战术。灵焰龙蜥三层楼高，有战术智慧。体内灵晶值几十银币，但没几个猎人能活着取晶。渊只有渊一个——灵能本身凝聚成的意识体，猎人把它放进渊是因为危险程度就是渊。

  T这个据说是壁盾军校课本上的叫法。研究院有更复杂的学术分类体系，但外环猎人用不上。猎人之间的赏金黑话更直接：白条（虫豸，顺手的事）、黄条（虫豸变异/牙，正经活）、红条（牙变异/角，命钱）、黑条（角变异/鳞，别想了）。

  异灵不是被封印创造出来的怪物。封绝之前它们就存在。封印期间灵能衰退导致退化，灵能恢复后重新进化。灵晶是长期高灵能环境里自然凝结的——灵能浓度越高等级越高，灵晶品质越好。这就是猎杀暴利来源，也是异灵仇恨人类的根源。
