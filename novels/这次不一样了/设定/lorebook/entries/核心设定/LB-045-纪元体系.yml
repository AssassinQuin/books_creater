content: |
  世界历史划分为四个纪元，每个纪元都以一对关键人物为标志。纪元1起源（约400年前）：封绝事件发生，虞渊登场。封印泄漏导致灵能弥漫整个世界，人类和异灵同时开始与灵能共存的全新历程。这是一切的起点。

  纪元2战火（约300年前）：裴昭和裴晗的时代。灵能催生异灵大规模进化，兽潮频发，人类陷入生死存亡的战争。裴昭为拯救族人自愿被铸成灵能容器（这是整部小说中最沉重的事件之一），教会由此创建并开始积累权力。这一纪元奠定了教会统治的基础。

  纪元3秩序（约100多年前）：许知和许行的时代。他们通过计算推演出了虞渊的存在，触及了世界运转的核心真相——然后被灭口。这一纪元揭示了教会维护秩序的代价：任何接近真相的人都会被消除。许知许行的发现成为后来者（包括沈野）的重要线索。

  纪元4暗涌（当前）：沈野和全队的时代。灵能恢复的速度跟不上人类消耗的速度，整个体系在透支运转。禁地的异动加剧、兽潮频率上升、资源争夺白热化——表面上的秩序之下暗流涌动。这一纪元的主角们将面对前三纪元累积的所有矛盾。

  虞渊的管理模式经历了迭代：最初无管理（灵能自由弥漫，混乱无序）→初版管理（尝试控制但失败，代价惨重）→成熟模式（控制灵能浓度+管控觉醒+发展灵能科技+建立阶级分化，维持了较长时间的稳定）→当前的透支模式（为了维持稳定开始榨取普通人+加大猎杀异灵力度，系统正在崩溃边缘）。
