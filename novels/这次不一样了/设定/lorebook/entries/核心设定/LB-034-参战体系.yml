id: LB-034
name: 参战体系
keys: [参战, 灵装师, 战术师, 灵工匠, 驯导者, 兵种协同]
secondary_keys: [觉醒者参战, 灵能武器, 统一灵能状态, 战斗配置, 战术配合, 非觉醒者战斗]
selective: false
selective_logic: 0
content: |
  这个世界的战斗不是觉醒者秀操作、其他人蹲后面看的独角戏，而是多兵种协同的体系化作战。五种参战类型各有不可替代的角色。

  五种参战类型：觉醒者（灵能直接战斗，前线主力）、灵装师（操作灵能科技装备，火力支援+战术增幅）、战术师（未觉醒、无灵能装备，但拥有丰富战斗经验的老兵，负责指挥调度）、灵工匠（战场制造和维修灵能装置，后勤核心）、驯导者（与灵兽建立灵能连接协同作战，特殊兵种）。

  灵装师是关键纽带——他们通过灵能武器激活"统一灵能状态"：使用时获得约30米灵能感知范围、基础护盾、以及一定的能力增幅效果；放下武器即恢复普通状态。这意味着非觉醒者通过灵装也能获得一定的灵能作战能力，打破了"只有觉醒者才能战斗"的垄断。

  写作要点：战斗场景中不能只描写觉醒者的操作。每个角色在战斗中都有明确分工，灵工匠修装备、战术师判断局势、驯导者操控灵兽。沈野作为铸造者属于灵工匠序列，他的战场价值不在于直接战斗，而在于为队友提供装备支撑。
