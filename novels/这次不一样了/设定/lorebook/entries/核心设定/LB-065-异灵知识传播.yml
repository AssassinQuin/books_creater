id: LB-065
name: 异灵知识传播
keys: [猎人口传, 异灵知识, 公告栏, 标记系统, 辨识, 黑市情报]
secondary_keys: [师徒制, 赏金榜, 酒馆信息, 猎团分工, 研究院手册, 异灵辨识, 情报贩子]
selective: true
