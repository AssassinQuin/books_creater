content: |
  普通人对异灵的认识完全依赖口传体系，没有正规学校系统教授相关知识。知识传播靠五个主要渠道，每个渠道的可靠性和覆盖面差异极大。

  第一渠道是猎人口传（师徒制）：老猎人带新猎人，在实战中传授异灵习性、弱点、应对策略。这是最可靠但覆盖面最小的渠道，知识高度经验化、个性化，不同师傅教的东西可能互相矛盾。方岩的路线标记系统就属于猎人口传的延伸——他在沿途岩石和树干上刻的标记（三角形=安全、叉号=危险、圆圈=有水），成为猎人圈子里通用的"路标语言"。

  第二渠道是灵能公告栏：兽潮预警、异灵目击报告、失踪猎人通知。公告栏的信息灵枢审查后发布，外环的公告栏内容更原始、更直接——"昨日碎岩谷发现T1级异灵，目击者3人均存活"这种措辞。中环公告栏被"净化"过。

  第三渠道是研究院手册（简化版）：研究院向中环城市发放的异灵辨识手册，但内容高度简化，只包含常见异灵的基础信息。外环几乎见不到。

  第四渠道是标记系统：方岩在15年斥候生涯中创始的路线标记体系，被壁盾猎人和外环猎人广泛使用。标记刻在岩石、树干、管道壁上，用统一的几何图形传递信息。

  第五渠道是黑市情报贩子：付费获取的异灵信息，来源不明、真假混杂，但有时能买到研究院手册上没有的稀有异灵资料。

  异灵辨识的实际操作靠赏金榜——上面写明"特征描述+等级评估+悬赏金额"，猎人照着特征认。同一只异灵经常被多个猎手或猎团抢，猎团内部有固定分工（侦察/诱饵/主攻/收尾）。酒馆是信息交换中心——猎人吃饭喝酒时交换最近在路上看到的情况，比公告栏更新更快但更不可靠。

  写作指导：异灵知识传播体系体现"信息就是生存资源"。写外环场景时随时可以插入口传细节——沈野听到某只异灵的传闻时皱眉"不对，老陈说过那个特征是T2不是T1"。猎人口传中的矛盾和错误是制造戏剧冲突的好工具。方岩的标记系统可以出现在旅途场景中作为环境细节。
