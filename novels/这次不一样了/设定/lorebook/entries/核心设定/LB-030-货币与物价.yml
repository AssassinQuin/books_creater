content: |
  世界存在双轨货币体系。普通人日常使用铜银金：1金币=10银币=100铜板。觉醒者和灵能经济圈子使用灵晶，灵晶与金银之间无固定汇率，由灵站通过兑换券体系调控。

  外环物价（铜板）：杂粮饼5-8铜板、一桶水3铜板、标准碎渣袋10-15铜板、照明石50铜板。拾荒者日均收入20-30铜板，矿工30-50铜板——一天的收入勉强糊口，存不下钱。外环居民一顿饭的钱就是他们半天的命。

  中环物价（银币）：路边摊2银币、灵能烤炉热饼3银币、旅店5银币/晚。中环居民日均收入10-15银币，约等于外环的10倍。中环一顿路边摊的钱，外环人要干三天活。

  灵站兑换券是收割机制：8折收购外环猎物/材料，加上30-40%的商品溢价转售，实际抽成约50%。外环人交出去的每一份收获都被灵站吃掉一半。这不是慈善，是精密的财富虹吸管道。

  写作要点：物价差异是阶级差异最直观的体现。不要用抽象的"贫穷"来形容外环，用数字——一顿饭等于几天的命。当沈野帮别人算账时会自动触发物价知识。中环消费场景要让读者感受到"这对沈野来说是奢侈"。
