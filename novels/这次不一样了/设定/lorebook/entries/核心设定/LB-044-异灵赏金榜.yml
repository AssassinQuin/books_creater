content: |
  异灵赏金榜是狩猎经济的核心信息载体，以两种形式存在：灵站的官方公告栏（标准格式，定期更新）和猎人酒馆墙上的手写纸条（非正式，信息更杂更及时）。两条渠道互相补充——灵站给标准价，酒馆给额外情报。

  赏金来源多样：灵站发布标准收购任务和异常加价通知（某区域异灵数量激增时会加价刺激猎杀）、猎团发布线索悬赏（自己发现目标但人手不足时悬赏协助）、商队发布护航任务（需要猎人护送通过危险路段）、黑市暗中高价收购变异灵晶（不问来路，价格是灵站的2-3倍但风险极高）。

  四级赏金体系对应异灵威胁等级：白条（T1普通异灵，赏金几个铜板，拾猎者的日常收入来源）、黄条（T1变异或T2级别，十几到几十铜板，需要猎手级别实力）、红条（T2变异或T3级别，几银币，通常需要猎团协作完成）、黑条（T3变异或T4级别，几十银币，只有壁盾猎杀队才有能力接手，涉及官方军级装备调配）。

  标准辨识格式示例："黄条·灰蜥群异常/西三区管道群·目击T1灰蜥三只以上/灵站加价收购"。格式为：等级条·目标描述/地点·补充情报/发布方。猎人看到后根据自身实力判断是否接单。酒馆里的手写条更随意："红条！南区矿道有大家伙，声音像打雷，求组队，四缺二。"
