content: |
  灵站体系不只是灵能农场，它是灵能浓度的恒温器。虞渊在纪元1末发现了一条被忽略的曲线：灵站密集区域的灵能游离浓度下降后，禁地边缘的灵能波动频率出现同步衰减——精确正相关，约40天滞后。灵站抽取参数每提高5%，禁地边缘波动在40天后下降约0.3%。这不是灵感，是数学。

  从那一刻起虞渊有了双轨逻辑。第一轨是人类棋盘：控制灵能浓度、限制觉醒者数量、维持社会秩序。第二轨是渊的棋盘：压制渊的苏醒，保持灵能环境低位运行。两条棋盘大多数时候方向一致（都需要控制灵能），但在极限处产生撕裂——灵能浓度不可逆上升时，人类棋盘要求释放更多灵能让社会运转，渊的棋盘要求加速抽取压低环境浓度。灵衰症患者是两条棋盘交汇处的代价：他们的身体是灵站抽取效率的消耗品，而灵站抽取效率是渊继续沉睡的保险。虞渊选择了，不是一次，是每一天。

  不可逆上升的物理基础：虞渊400年前撕开的封印裂缝从未完全愈合，渊的灵能体量持续对封印施加压力，裂缝在400年中缓慢扩大。更致命的是正反馈循环——灵站网络维持本身需要消耗大量灵晶，消耗越多需要更多人产出灵晶，更高共振强度又加速裂缝扩大。恒温器本身正在成为温度上升的推手。外环贫民被加速榨取不是虞渊想多赚钱——是灵能浓度上升逼着他提高提取效率，每一次提高都是赌注：提取多了灵衰症爆发（人命代价），提取少了渊醒得更快（种族存亡代价）。
