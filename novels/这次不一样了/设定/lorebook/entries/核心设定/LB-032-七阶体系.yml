id: LB-032
name: 七阶体系
keys: [七阶, 初觉, 通感, 凝相, 共鸣, 蜕变, 域场, 灵源]
secondary_keys: [阶位, 进阶, 觉醒等级, 灵能等级, 灵能者, 觉醒者等级]
selective: false
selective_logic: 0
content: |
  觉醒者的能力水平按灵能操控深度分为七个阶位。这不是灵枢官方的标准分类——研究院有正式的学术体系，但猎人口中另有叫法（"菜鸟""老手""硬茬子""怪物"），不同区域的叫法也不一样。

  初觉——刚觉醒，能感觉到灵能存在但控制不了。大部分人觉醒后就停在这了。外环浓度太低，初觉者几乎什么都做不了。通感——能主动操控灵能了，有了基本战斗力。大部分猎团里的觉醒者都是通感级。凝相——灵能能在手里"成型"了，有具体形状和稳定结构。到了这个级别才算核心战力。共鸣——灵能开始和周围环境产生共振，能力发生了质变。研究院说这个级别的觉醒者"不是人了"，猎人的说法更含蓄："这帮人不对劲。"蜕变——极少数。能力本身发生了根本性改变，不是变强是变了。研究院档案里有记录的蜕变级觉醒者两只手数得过来。域场——传说中的级别。据说能展开个人领域，领域内灵能规则由觉醒者定。壁盾老兵说赵铁山的军团长好像有这个苗头，但没人见过。灵源——研究院论文里标注"理论推测"的概念。意思是如果能力继续往上走最终会触及灵能本身的"源"。没人亲眼见证过。争论了几十年没结论。

  灵能浓度直接卡脖子——外环浓度极低，再强的觉醒者到那里也得打折。猎人打比方："在外环放觉醒者，跟在矿坑深处点火把差不多——能亮，但亮不了多远。"

  每个阶位内部有粗糙的"基础→进阶→质变"三个阶段，但不是所有觉醒者都能走完全程。质变通常不是练出来的，是"活出来的"——生死之间的突破、对灵能本质理解的飞跃、或者以某种代价换来的跨越。
