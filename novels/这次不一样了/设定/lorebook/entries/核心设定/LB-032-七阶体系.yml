content: |
  觉醒者的能力水平按灵能操控深度分为七个阶位。这不是灵枢官方的标准分类——研究院有正式的学术体系，但猎人口中另有叫法（"菜鸟""老手""硬茬子""怪物"），不同区域的叫法也不一样。

  初觉——刚觉醒，能感觉到灵能存在但控制不了。像隔着一层毛玻璃看世界——知道外面有东西，但看不清。大部分人觉醒后就停在这了。外环浓度太低，初觉者几乎什么都做不了。通感——灵能开始回应你了。不是你单方面去感觉——是你伸手，它接住。有了基本战斗力。大部分猎团里的觉醒者都是通感级。凝相——灵能在你手里不再是流动的雾气，它有了形状和结构，像握住了一块实实在在的东西。到了这个级别才算核心战力。回响——你的灵能往外走了，像水从杯子里漫出来。外面的灵能也在回应你——站在矿脉旁边能感觉到整条矿脉的走向，站在异灵巢穴外面能摸到巢穴里面的灵能动静。你的灵能碰到什么，什么就给你回响。研究院说这个级别的觉醒者"不是人了"，猎人的说法更含蓄："这帮人不对劲。"化生——极少数。不是变得更强，是变成了别的东西。能力本身发生了根本性改变，不是升级，是换了一种存在方式。研究院档案里有记录的化生级觉醒者两只手数得过来。自成——传说中的级别。觉醒者自成一个完整的灵能体系，不需要顺应外界的灵能规则——因为在他身边，规则是他定的。据说能展开"个人领域"，领域内灵能按照他的意志运行。壁盾老兵说赵铁山的军团长好像有这个苗头，但没人见过。归源——研究院论文里标注"理论推测"的概念。意思是如果能力继续往上走最终会触及灵能本身的"源"——不是理解它，是感受到它。像站在一条河的尽头，看见水从哪里来。没人亲眼见证过。争论了几十年没结论。

  灵能浓度直接卡脖子——外环浓度极低，再强的觉醒者到那里也得打折。猎人打比方："在外环放觉醒者，跟在矿坑深处点火把差不多——能亮，但亮不了多远。"

  每个阶位内部有粗糙的"生→熟→化"三个阶段——生是刚到这个阶位，一切还生疏；熟是摸透了，能力运用自如；化是融会贯通，到了突破的边缘。不是所有觉醒者都能走完全程。化通常不是练出来的，是"活出来的"——生死之间的突破、对灵能本质理解的飞跃、或者以某种代价换来的跨越。
