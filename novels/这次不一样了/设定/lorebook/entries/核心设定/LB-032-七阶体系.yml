id: LB-032
name: 七阶体系
keys: [七阶, 初觉, 通感, 凝相, 共鸣, 蜕变, 域场, 灵源]
secondary_keys: [阶位, 进阶, 觉醒等级, 灵能等级, 灵能者, 觉醒者等级]
selective: false
selective_logic: 0
content: |
  觉醒者能力划分为七个阶位。初觉（约65%觉醒者，被动感知灵能，无法主动操控）→通感（约20%，可主动操控灵能，初具战斗力）→凝相（约10%，能力成型，形成稳定战术）→共鸣（约3.5%，能与周围灵能环境联动，实力质变）→蜕变（约1%，经历二次进化，本质改变）→域场（约0.4%，展开个人领域，领域内近乎无敌）→灵源（存疑，理论推测的最高阶位，无人亲眼见证）。

  灵能浓度直接决定能力上限。外环灵能浓度极低，觉醒者能力被严重压制，即使天资卓绝也难以突破通感。中环浓度提升，进阶概率显著增加。灵枢核心区浓度最高，是高阶觉醒者的聚集地。

  每个阶位内部有三个进阶阶段：基础（刚突破，能力粗糙）→进阶（用法变多、变精，量变积累）→质变（本质改变，产生全新应用方式）。质变触发条件有三条路径：理解深化（对灵能本质的认知飞跃）、代价交换（以某种失去换取突破）、极限突破（生死之间打破桎梏）。

  五大基础能力存在相克关系：分解克制编织（拆散结构）、编织克制感知（隔绝信号）、感知克制体质（看穿弱点）、体质克制分解（以力破巧）、分解回到起点。相克不是绝对的，高阶对低阶可跨系压制，但同阶相克优势明显。
