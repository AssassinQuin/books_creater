selective: false
selective_logic: 0
content: |
  灵衰症不是灵枢故意制造的疾病，是灵站系统的累积副作用。正常使用灵站（低频率短时间）像献血一样无害，人体灵能自然恢复。灵枢为提高灵晶产量在设备中增加了共振增幅器，参数在安全线附近但没超线，单次使用不会出问题。问题在于累积：高频加长期使用，人体灵能循环系统被反复微损伤——像血管壁被反复磨损。灵能残渣沉积在循环系统的管壁上越积越多，最终堵塞整个循环。这就是灵衰症。

  灵枢知道：早期数据就显示了沉积现象。但公布真相意味着"灵站不安全"→人们不来卖灵晶→灵枢收入断崖→整个灵能供应体系崩溃。所以灵枢选择隐瞒，对外宣称"灵能时代普遍现象"。没有人坐在会议室里说"让我们制造疾病"，是系统惯性——停下来就崩溃，只能继续。

  发病率数据：内环高浓度区30-40%、中环10-20%、外环5-10%。高发年龄16-18岁。病情分级：轻度（月卖不到10块，可逆转寿命基本不受影响）、中度（月10-30块，寿命缩短10-15年）、重度（月超过50块，寿命不足10年）。高产出源恶化速度常人3-5倍。

  灵枢医疗体系不治病只管理：灵能检测中心（实际用途是标记高产出源）、灵能医院（服务觉醒者和灵枢员工，普通人就医难）、药剂分发站（免费发缓解药物让患者能继续工作维持生产率，副作用是慢性肝肾损害和依赖性）。进化研究院有治疗理论但缺灵枢核心数据（灵枢锁着不给怕暴露），林原用活体实验方式获取数据，在伦理红线边缘做研究。
