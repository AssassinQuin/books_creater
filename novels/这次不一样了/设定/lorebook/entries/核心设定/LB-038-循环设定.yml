content: |
  远古文明曾掌握灵能，因裔族战争几乎灭绝。幸存者封印灵能（黑月就是封印的物理投影），记忆随时间消散。400年前虞渊撕开封印裂缝，灵能重新扩散——历史正在重演。

  上一次循环的真相：远古文明末期，封印者与太渊（上一个渊）在禁地核心决战。封印者惨胜，拼尽全力只能勉强封印太渊，自己力竭化为禁地本身。碑文只记录了"封印"，不敢写"打不赢"。太渊被封印但没死只是沉睡。封印者留下遗言："希望下一个比我们聪明。"

  这一次不同：虞渊没有"封印"任何东西。他拆掉了自己——灵枢体系瓦解，灵能不封，碑文留着翻译，选择权交给活着的人。渊选择自己沉睡，留一盏灯做警告。这一次没有惨胜，是双方都放下了。

  虞渊在纪元1中期就知道渊的存在——深入禁地边缘勘探时感知到深处那个庞大的灵能体，它没攻击只是翻了个身。从此虞渊的全部体系设计多了一个隐藏维度：不只是控制人类灵能，还是在维持让渊继续沉睡的灵能平衡。两条路径：虞渊的"控制"（替所有人做决定），渊的"制衡"（确保没有任何一方能彻底压倒另一方）。两个路径都失败了——控制变成体系性榨取，制衡变成永恒的裔族战争。

  渊在沉睡中做了五件事：分化基因自然扩散（降低异灵进化门槛）、鸦的族群记忆传递、裔族内部分化的自然结果、唤醒预案（走向禁地摧毁封印解放种族）、月裔作为分化基因的偶然副产品。渊和虞渊的分歧不是善恶，是种族立场。
