content: |
  天空中挂着一轮黑色月亮。灵能从它辐射到整个大陆。它不是天体——是远古文明封印的物理投影。黑月在叙事中承担三层逐步揭示的功能：第一层，灵能源头（所有人都知道灵能从黑月来，这是常识）；第二层，远古封印（黑月不是自然现象，是400年前被虞渊撕开的封印的物理证据）；第三层，循环的物理证据（黑月存在意味着封印存在，封印存在意味着上一次文明也面临同样的灵能危机）。

  各势力对黑月的说法完全不同，写黑月相关场景时必须根据视角选择立场：灵枢集团视为核心资产——灵能来源，经济体系的基础；进化研究院视为进化催化剂——研究其物理性质；壁盾军团视为异变源头——所有问题的根源；遗脉守护者视为封印——封绝曾试图理解它；星火社视为被掩盖的真相。

  黑月和灵能浓度的关系：灵能从黑月辐射扩散，浓度随封印裂缝大小变化。400年前裂缝被撕开后灵能重新弥漫大陆，浓度持续上升。黑月在天空中是恒定存在的，不会消失——它是封印结构的物理投影，只要封印还存在黑月就在。写黑月时要给它物理质感——不是发光的天体而是吸收光线的黑洞，仰望它时应该有灵能压迫感。它在不同卷的作用不同：早期是背景氛围（天空中的黑色存在），中期成为讨论对象（各势力对黑月的不同解释），后期成为核心冲突（封印裂缝、循环真相的物理证据）。
