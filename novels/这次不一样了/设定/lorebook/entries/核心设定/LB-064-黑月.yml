content: |
  天空中挂着一轮黑色月亮。灵能从它辐射到整个大陆。它不是天体——是远古文明封印的物理投影。

  大多数人对黑月的态度很简单：灵能从黑月来，这就是常识。灵枢集团的命脉也系在黑月上。但随着故事推进，黑月的来历被一层层剥开——它不是自然现象，是400年前被虞渊撕开的封印的物理证据。黑月存在意味着封印存在，封印存在意味着上一次文明也面临同样的灵能危机。

  灵枢视黑月为核心资产，进化研究院研究它的物理性质，壁盾军团把所有问题归咎于它，遗脉守护者知道它是封印但说不清来龙去脉，星火社怀疑黑月背后有被掩盖的真相。每个势力看到的是同一轮黑月，读出的完全是不同的东西。

  灵能从黑月辐射扩散，浓度随封印裂缝大小变化。黑月在天空中是恒定存在的，不会消失——它是封印结构的物理投影，只要封印还在黑月就在。仰望它时有灵能压迫感，不像发光的天体，更像是天空中被撕开的一个暗色伤口。
