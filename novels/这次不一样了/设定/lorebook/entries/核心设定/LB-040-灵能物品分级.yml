id: LB-040
name: 灵能物品分级
keys: [灵能装备, S级, A级, B级, 灵源器, 共鸣器, 铸造]
secondary_keys: [灵能武器, 灵能防具, 灵能耗材, 灵能工具, 灵能共鸣物, 装备分级, 灵能物品]
selective: false
selective_logic: 0
content: |
  灵能物品按危险等级和制造难度分为四个级别。S级灵源器是远古遗物级的存在，能力极其强大但带有不可预测的反噬风险，数量稀少且大多下落不明。A级共鸣器是高级定制品，与使用者的灵能产生共鸣增幅，但会造成明显的灵性消耗，不能长时间使用。B级灵能装备是沈野在中后期可以批量制造的级别，性能稳定但需要定期充能。C级基础灵器是最常见的灵能工具，功能简单无副作用，普通人也能使用。

  灵能物品涵盖五种类型：灵能武器（直接用于战斗，如灵能短刀、传导手套）、灵能防具（提供防护，如灵能护盾、强化铠甲）、灵能耗材（一次性消耗品，如碎渣弹、灵能回复药剂）、灵能工具（辅助功能，如照明石、灵能探测仪）、灵能共鸣物（增幅或辅助能力，如共鸣石、灵能传导介质）。

  能力与装备的化学反应是战斗体系的核心看点。沈野的铸造能力+蔓的编织能力=制造出永久灵能装置（编织结构固定灵能流动形成稳定回路）。陆沉的分解能力+传导手套=实现远程分解（手套作为传导介质将分解力释放到触不到的距离）。不同能力的搭配使用能产生远超单兵的效果，这就是团队配合的魅力。

  沈野作为铸造者的独特角色定位：他不只是"做装备的工匠"，而是根据每个队友的能力特点定制专属装备，弥补短板、放大优势。给感知型队友做信息中继装置、给体质型队友做力量传导护甲——好的铸造者是团队战力的倍增器。
