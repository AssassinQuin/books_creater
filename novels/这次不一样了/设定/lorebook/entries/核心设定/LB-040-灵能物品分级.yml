id: LB-040
name: 灵能物品分级
keys: [灵能装备, S级, A级, B级, 灵源器, 共鸣器, 铸造]
secondary_keys: [灵能武器, 灵能防具, 灵能耗材, 灵能工具, 灵能共鸣物, 装备分级, 灵能物品]
selective: false
selective_logic: 0
content: |
  猎人不太用S/A/B/C这种分级。他们的叫法更粗糙：

  "老古董"——远古遗留下来的灵能物品。没人知道怎么造的，可能整个大陆就这一件。效果强得离谱，但副作用说不清——用过的人要么死了要么疯了要么变成了传说。"认主的"——和特定觉醒者共鸣后才能完全发挥效果的装备，高级铸造师定制。戴着战斗时像多了一条手臂，摘下来会虚弱一阵——灵能被透支了，猎人管这叫"戒断"。"量产货"——沈野中后期可批量做的级别。不算差，能用，但灵能回路有衰减，一段时间得重新充能。壁盾军团普通士兵的灵能短刀就是这个级别。"破烂"——最低级的灵能工具。照明石、灵能检测器、基础切割工具。几乎没副作用，效果有限。外环聚落的灵能工具全是这个级别。

  灵能物品覆盖的范围很杂：灵能武器（灵能短刀、传导手套）、灵能防具（灵能护盾、强化铠甲）、一次性耗材（碎渣弹、灵能烟雾弹）、工具（照明石、通讯石、灵能检测器）、还有和特定能力者共鸣的特殊装备。沈野的铸造能力让他能根据每个队友的能力定制装备——不是造最强的，是造最适合的。
