id: LB-033
name: 灵能区域化觉醒
keys: [灵能区域, 觉醒倾向, 灵能味道, 浓度, 金色, 蓝灰]
secondary_keys: [灵枢核心区, 北方矿区, 东部海岸, 西部荒原, 南方密林, 区域特化, 灵能环境]
selective: false
selective_logic: 0
content: |
  灵能从禁地向四面八方扩散。流的过程中"味道"会变——不是化学意义上的味道，是猎人形容灵能特征的说法。有些区域灵能偏硬，有些偏流动，有些带着让人头皮发麻的活的感觉。长期住在某区域的人觉醒时，身体本能地用最熟悉的方式操控灵能——像说话带口音，不是故意的，是环境塑造的。

  枢都周围——灵能最浓最纯，觉醒的人控制力强。猎人叫"金区"，高浓度灵能带金色。北方矿区——灵能和矿石纠缠，矿工觉醒后多是体质强化或地质感知，灵能发蓝灰色，矿工管它叫"矿味"。东部海岸——灵能像水在流动，海边觉醒的人灵能带波浪节律。西部荒原——灵能稀薄分散，偶尔有人觉醒了灵能呈"编织"特征，能把零散碎片拼成稳定结构。南方密林——灵能和植物纠缠，密林深处觉醒的人灵能带活的气息。

  沈野在外环长大，觉醒了编织型能力——按区域理论应该归属西部荒原，但他从没去过荒原。研究院论文提过这类案例，写了四个字："成因未明。"猎人管这种不对口的人叫"野路子"。

  以上是统计规律不是定律。总有例外。北方矿工有人觉醒了波动型，外环混合区有人觉醒了不属于任何区域的能力。这些异常有的被归结为天赋，有的归结为运气，有的——没人能解释。
