id: LB-033
name: 灵能区域化觉醒
keys: [灵能区域, 觉醒倾向, 灵能味道, 浓度, 金色, 蓝灰]
secondary_keys: [灵枢核心区, 北方矿区, 东部海岸, 西部荒原, 南方密林, 区域特化, 灵能环境]
selective: false
selective_logic: 0
content: |
  灵能从禁地向外扩散，不同区域因距离禁地方位不同，灵能的"味道"（属性倾向）存在显著差异。长期生活在某区域的人觉醒时，会自然倾向于用最熟悉的方式操控灵能，就像方言影响口音一样。这是统计倾向，不是绝对限制——总有突变个体。

  五大灵能区域：灵枢核心区（金色灵能，倾向同化/控制型能力）、北方矿区（蓝灰灵能，倾向强化/感知型）、东部海岸（青绿灵能，倾向波动/传输型）、西部荒原（土黄灵能，倾向编织/结构型）、南方密林（翠绿灵能，倾向生命/共生型）。外环位于各区域交界处，灵能混合，觉醒倾向最不固定。

  沈野是典型突变个体——他在外环混合区长大，觉醒了编织型能力。按照区域理论，编织型倾向归属于西部荒原的土黄灵能，但沈野从未在荒原生活过。他的编织能力可能源于个人天赋、未知变量，或是某种更深层的命运安排。这使他成为现有理论无法解释的异常数据。

  写作要点：区域化设定为世界增添了地理层面的深度。角色觉醒的能力类型可以暗示其成长背景，或制造反差。当出现"不符合区域倾向"的觉醒者时，应当引起注意——要么是剧情伏笔，要么是人物独特性的体现。
