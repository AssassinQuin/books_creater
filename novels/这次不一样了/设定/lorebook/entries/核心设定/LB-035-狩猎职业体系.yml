content: |
  狩猎异灵是一条完整的产业链和职业阶梯。拾猎者处于最底层，用刮刀和碎渣弹在外环边缘捡漏，死亡率最高但门槛最低。猎手是入门级专业猎人，配备灵能短刀和陷阱，能独立处理低级异灵。猎团是3-7人的专业小队，分工明确，能应对中等级别的威胁。壁盾猎杀队是顶级配置，拥有军级装备，只有高风险高回报任务才会出动。

  狩猎配套职业生态完整：取晶师（专业提取异灵体内灵晶）、陷阱匠（制作灵能陷阱）、鉴定师（评估灵晶品质和异灵等级）、向导（熟悉地形和异灵出没规律）、装备匠（维修保养灵能装备）、灵枢回收官（官方代表，负责征收和监管）、药材商（异灵材料收购加工）、猎人酒馆（信息交换+任务发布+装备交易+社交场所）。

  异灵赏金分为四级：白条（T1普通异灵，赏金几个铜板，拾猎者主要目标）、黄条（T1变异或T2，十几到几十铜板，猎手级别）、红条（T2变异或T3，几银币，需要猎团配合）、黑条（T3变异或T4，几十银币，壁盾猎杀队级别，涉及军级装备调配）。

  猎人酒馆是信息交换中心，墙上贴满手写纸条和灵站公告。这里不只有任务，还有情报、装备交易、人脉网络和灰色地带的生意。一个有经验的老猎人在酒馆里待半天，比在外环转三天获取的信息还多。
