content: |
  灵站发放的灵能供体身份卡。卡面记录持有者的灵能频率图案、灵能产出历史数据，以及一枚隐蔽的定位标记芯片。

  基本功能：凭共振卡在灵站进行灵能提取操作，领取灵能供体报酬。卡内频率图案用于匹配供体身份，产出数据决定报酬等级。是灵能供体的"工作证"和"工资卡"。

  隐秘功能：定位标记可被灵站远程激活追踪，用于掌握供体行踪。沈念在Ch022获取共振卡，在Ch023出发前自主关闭了定位功能——这意味着沈念对灵站监控体系有所警觉，或者有人提前告知了她这一隐患。

  写作要点：共振卡的双重性（生存工具 vs 监控手段）是灵枢控制体系微观层面的体现。Ch023关闭定位的细节暗示沈念的信息来源或直觉判断力，可作为角色成长伏笔。后续剧情中，是否有人知道沈念关闭了定位、灵站是否发现定位丢失，都是可以制造紧张感的叙事抓手。
