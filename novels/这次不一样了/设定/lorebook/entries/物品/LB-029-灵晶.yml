content: |
  灵晶是这个世界的硬通货和能源核心。碎灵晶3铜板一颗，高灵晶（治疗级）120铜板一颗。来源：灵站从供体体内提取（15分钟每次），或异兽体内获取。虫豸结晶5-10铜板，牙结晶1-3银币。

  日常物价体系必须记住：一桶水3铜板，半份杂粮饼8铜板，标准灵能碎渣袋10-15铜板，拾荒者日均收入约45铜板，1银币等于100铜板。沈念卖灵晶攒治疗费——120铜板一颗的治疗级高灵晶对外环拾荒者来说是巨款。

  经济写作要点：灵能浓度上升时灵站收获更高，"丰收期"的收入增加制造了危险循环——浓度上升导致收入增加，人们更积极卖灵晶坐吸收椅，更多灵衰症案例被掩盖在"丰收"的喜悦里。韩朗和灵枢高层知道浓度上升的真正含义（渊在翻身），但对外只说"灵能活跃期"。穷人看到的灵晶价格波动不是市场规律，是灵能浓度变化的映射。

  灵能碎渣是管壁自然沉积物（灰绿色单层回路），可卖钱、填充照明石、压缩制弹。灵能碎片从碎渣提炼（灰白色，有单层或多层回路结构），沈野的特殊碎片是五层嵌套回路——V1核心剧情道具，有牵引感（感知灵能体轮廓）和干扰牙核心频率的功能。
