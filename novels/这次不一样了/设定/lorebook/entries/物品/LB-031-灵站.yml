content: |
  灵站是整个世界的核心基础设施。对外功能：灵能管理、灵晶收购、供体注册、灵能浓度监测。标配设施有吸收椅、读取器、公告栏、检测器。灵能吸收椅15分钟每次，供体插管后感应板读数产出灵晶——这是普通人最直接的赚钱方式。

  普通人看到的灵站是真实有用的：稳定的灵晶交易市场、安全的居住区域（灵站周围灵能浓度被压低，异灵活动减少）、兽潮预警（救过无数人）、异灵赏金（猎人收入来源）。聚落围绕灵站建立不是因为灵枢规划，是因为灵站周边确实更安全。普通人的感受是"贵但是有用"——和现实中的医院类似。

  灵站建成前兽潮规律且分散，教会和猎人足以应对。灵站建成后大量抽取灵能导致局部浓度下降，禁地灵能压力释放方式改变，兽潮变得不规律——从"固定季节固定区域"变成"不确定时间不确定方向"。灵站既是保护者也是扰动源，普通人以为"灵能浓度上升导致兽潮加剧"是对的，但不知道灵站加速抽取也在扰动兽潮规律。

  共振卡是供体身份卡，记录灵能频率图案、产出数据、定位标记。隐秘功能：定位标记可被灵站追踪。灵枢为提高产量在设备中增加了共振增幅器，参数在安全线附近但没超线——单次无害，累积致命。
