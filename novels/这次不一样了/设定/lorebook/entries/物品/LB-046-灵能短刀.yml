content: |
  壁盾军团斥候、猎人队及专业猎人的标准近战武器。灵能短刀的杀伤原理不是物理切割，而是灵能切割——灵能从刀柄流入刀身，通过刀刃释放特定频率的灵能震荡，震碎异灵的灵能结构。

  消耗机制：每击杀一只虫豸约消耗使用者20%灵能储量。刀身内设碎渣仓储存灵能结晶残余，碎渣仓耗尽后刀刃变暗、失去灵能切割能力，退化为普通短刀。

  方岩的制式短刀：壁盾标配已使用15年，刀背刻有四道刻痕，代表击杀过4只牙级异灵。维护需定期清理碎渣仓中的灵能结晶残余。外环区域没有军需站，维护材料需自备或从黑市获取。

  写作要点：战斗描写中强调灵能切割的特效——刀刃划过异灵躯体时不是血肉分离，而是灵能结构碎裂的视觉效果。碎渣仓耗尽的紧张感可作为战斗节奏控制手段。方岩短刀上的刻痕是他的资历证明，可作为角色认同感的细节。
