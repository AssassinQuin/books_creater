content: |
  照明石：沈野用灰白色灵能碎片+布条+碎渣填充手工制作的简易光源，发出暖黄色光芒，可持续照明3-5夜。沈野给沈念做的照明石放在管壁角落，暖黄光照亮沈念画的太阳画——这是"家"的象征，是废墟中最珍贵的情感锚点。

  日常物品体系：铁杯（聚落共用，豁了一角）、铁皮箱（藏铜板和存粮）、炭笔（沈念画太阳画用的）、布条（万能材料，包扎、捆绑、照明石组件均可）。杂粮饼8铜板半份，一桶水3铜板——外环聚落的基本物价参考。

  写作要点：这些日常物品是构建世界质感的关键道具。照明石的暖黄色光与外环的灰暗环境形成对比，每次提到都应该唤起"家"的情感。铁杯豁了一角这个细节暗示聚落物资的匮乏和共享经济。杂粮饼和水的价格可用于量化角色经济状况——沈野的铜板够买几份杂粮饼，就是读者理解他困境的标尺。
