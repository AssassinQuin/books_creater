content: |
  来源：从灵能碎渣中提炼获得，外观为灰白色半透明固体，内部可见单层或多层灵能回路结构。是外环经济的基础资源之一。

  等级体系：低纯碎片（常见，单层回路）→高纯碎片（少见，多层但结构简单）→多层嵌套碎片（极稀有，回路层层嵌套如微型迷宫）。标准碎片价格1-2铜板，鉴定费5铜板——鉴定本身可能比碎片更贵，底层居民多数凭经验判断。

  沈野的特殊碎片：五层嵌套回路结构，在Ch005废墟深处发现。这是V1核心剧情道具，具有两项关键功能：①牵引感——能感知附近灵能体的轮廓和频率，如同灵能雷达；②干扰能力——在Ch012中可干扰牙级异灵的核心频率，使其暂时失控。

  写作要点：特殊碎片是沈野从"底层幸存者"向"灵能相关者"转变的关键道具。牵引感的描写应具象化——不是抽象的"感知"，而是具体的频率信号、方向感、距离感。五层嵌套的稀有性意味着不可能批量获取，每一层嵌套都应该有视觉描写。
