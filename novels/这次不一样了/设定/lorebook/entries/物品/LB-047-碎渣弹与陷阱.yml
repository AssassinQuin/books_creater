content: |
  碎渣弹：将灵能碎渣高压压缩制成，内置触发器。引爆时触发器点燃碎渣，释放灵能冲击波。对T1级异灵可直接击杀（在管道等密闭空间内因冲击波反弹效果更强），对T2级仅能掀翻或击退，无法击杀。单颗价格3-5铜板，使用后弹壳可回收，回收价2铜板——底层猎人和聚落居民的经济循环。

  灵能陷阱：由铁片触发器、感应线和碎渣弹组合的一次性防御装置。感应线连接触发器与碎渣弹，异灵触碰感应线即引爆。陷阱为消耗品，触发后需重新布设。阿公在聚落北面入口布设的防线即以此类陷阱为核心。

  写作要点：碎渣弹的价格设定（3-5铜板）和弹壳回收（2铜板）体现了底层经济的残酷——每颗弹的实际成本只有1-3铜板，但那已经是很多人半天的收入。管道内反弹机制可为战斗场景提供环境战术描写。陷阱的布设和检查可作为日常节奏段落，体现聚落生活的紧张与 routine 并存。
