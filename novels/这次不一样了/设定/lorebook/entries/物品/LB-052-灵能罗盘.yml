content: |
  壁盾军团斥候标配装备，铜制盘面比手掌小一圈，刻度密密麻麻但磨损严重。功能为感知周围灵能频率并将其转化为地形信息——管道走向、裂缝位置、管壁厚度都会在盘面上以微光线条的方式呈现。精度取决于环境灵能浓度：浓度越高，地形画越清晰；在灵能稀薄的外环，只能勉强分辨出大方向。

  方岩的罗盘是他在壁盾军团十五年斥候生涯的唯一遗物。盘面有数十道划痕——北境碎石刮的、灰蜥爪子挠的、暴风雪冻裂的，每一道都是一次差点回不来的记忆。盘底刻着壁盾军团的编号，字迹已经被磨得快看不清了。

  Ch012中，牙级异灵的灵能余波横扫战场，方岩的罗盘被直接扫碎——盘面从中心裂开三道裂纹，指针弹出飞出两米远。方岩蹲在地上，在碎石堆里把碎片一块块捡起来，攥紧最大的一块碎片在手心，指节发白。从那一刻起他失去了斥候最重要的感知工具，只能靠十五年的经验硬走。

  写作指导：罗盘碎裂是方岩失去职业身份的象征性时刻。写罗盘时要体现"工具即自我认同"——方岩摸罗盘的动作像老兵擦枪，是下意识的习惯。碎裂后的替代行为：他会不自觉去摸腰间空荡荡的皮套，然后沉默。
