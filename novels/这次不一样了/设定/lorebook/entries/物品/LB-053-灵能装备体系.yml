content: |
  六大势力的装备风格鲜明，反映各自文化与资源禀赋。灵枢：标准化批量化生产，统一灰黑色调，刻有灵枢标识，强调可靠性和可替换性。壁盾：实用厚重，铁灰色重甲加厚护腕，粗犷但不粗糙，每件都像能当武器砸人。研究院：功能性强，多用途设计，常见可拆卸改装结构，外观简洁但接口复杂。教会：仪式性和装饰性并重，白金配色，常刻有经文纹样，实用性不如象征性。星火社：拼装自制风格，擅长将不同来源的零件组合，外表粗糙但暗藏巧思，注重隐蔽性。外环猎人/拾荒者：废料改造，功能至上，什么好用就用什么，外观杂乱但每一件都经过实战检验。

  装备五大类型——灵能武器（刀/矛/弓/弩，注入灵能增强杀伤）、灵能防具（护甲/护腕/盾，可形成灵能屏障）、灵能耗材（灵能弹/陷阱/烟雾弹，消耗品，一次性使用）、灵能工具（通讯石/照明石/检测器/罗盘，日常功能向）、灵能共鸣物（放大特定类型灵能的特殊装置，稀有且昂贵）。灵晶是所有灵能装备的核心能源，不同纯度决定装备性能上限。

  通信网络呈明显阶级落差。灵枢灵能通讯网覆盖内环全境、中环大部分区域，外环几乎无覆盖。壁盾军团靠信号弹加骑马传令，速度慢但可靠。商队带信是中环到外环最主要的通信方式，靠商队驿站接力传递。教会在南方密林中发展出独特的灵能感应通讯，通过训练有素的信使接力传达，灵枢对此知之甚少。

  写作指导：写装备时先确定角色属于哪个势力，装备风格自动对齐。外环角色的装备要"有故事感"——每件装备都带着修补痕迹和使用痕迹，体现资源匮乏。灵能耗材是战斗场景的节奏控制点——弹药耗尽制造紧迫感，陷阱布置体现角色经验。
