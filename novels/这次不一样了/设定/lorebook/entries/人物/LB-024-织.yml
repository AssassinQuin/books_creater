content: |
  裔族共存派领袖，编织型灵能操控，T4级。缓慢精准地说话，用编织比喻——"一根线断不了网，但所有线都往一个方向拉，网就会碎。"教蔓编织的那个，派蔓做人类聚落的观察者。

  底层驱动：冷酷地尝试共存——验证不是信任。知道焱追杀蔓但没阻止——如果蔓被人类杀了说明共存不可行，那是数据不是悲剧。蔓带回结论后它说"够用了"——不是满意是务实。

  共存派内部也有分歧：一派主张"和平共处"即真正的停火共存，另一派认为"先打赢再谈"才有谈判筹码，和平只是手段而非目的。织见过太多失败的共存尝试——之前的每一次谈判都被人类猎杀异灵取晶的行为撕碎。它的克制来自理性而非渊的暗示。

  写织场景时记住：它的台词理性克制带有疲惫感，像在处理一个已经论证过无数次但总被推翻的数学题。不追求正义也不追求复仇，只追求族群延续。不要把共存派写成圣母——它的"和平"背后是对力量对比的清醒认知。织的沉默比焱的愤怒更可怕，因为沉默意味着它已经计算过了。
