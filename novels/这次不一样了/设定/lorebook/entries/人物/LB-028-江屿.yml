content: |
  灵枢安保部叛逃者，通感级灵能强化体质（力量+速度）。表面圆滑实际是怕——场面话是生存技能，在灵枢不说场面话的人活不久。话多但有用，喜欢打圆场，紧张时语速加快。沈野的沉默让他最不安。

  底层驱动：确认自己手上沾了多少血。不是正义感——是需要一个准确的数字才能决定自己该怎么活。被问到灵枢的事会打哈哈岔开，追问时突然安静——在想那个人说"江屿你怎么在这"时的脸。聪明但不够狠——灵枢不缺聪明人，缺的是能狠下心的人，所以他一直在基层。

  秘密：亲手"处理"过不只清退——还有知情者。被处理的那个碰巧认识他。偶尔睡不着会起来检查门窗——灵枢养成的习惯。表面上跟谁都处得来，实际不跟任何人交底。场面话太完美连自己都信了——直到在沈野面前冒出一句真话后恐慌。

  V4关键发现：发现灵站参数被人为调高——"不是故意害人，是为了多产灵晶。"这一发现推动沈野动机链转折：妹妹的病有办法治，但治疗需要的东西在灵枢手里被锁着。

  战斗：灵枢训练的标准套路——高效但无特色，实战经验不如方岩。怕→不表现出来但手微微抖（精细动作时暴露）；内疚→说多余话填满沉默；被揭穿→先否认然后崩溃式全说。

  口头禅："这事儿吧说起来复杂。""别看我我也是打工的。""不是等等你们认真的？"他不会果断做决定——上一次果断执行的结果让他受不了。写江屿场景时记住：他的圆滑是铠甲不是本性，偶尔泄露的真话是最有力量的时刻。
