content: |
  渊不是生物，是灵能浓缩到极限后自然凝聚的龙形意识体——灵能的最终形态。没有血肉，只有灵能和意识。完整体是覆盖整个禁地区域的银白色龙形灵能体，当前处于压缩态：蜷缩在禁地最深处，约3米直径的银白色灵能球体。

  五大能力：灵能吐息（定向灵能攻击，可融穿灵能护盾）、灵能风暴（领域类，覆盖型灵能压制）、灵能鳞甲（灵能密度防御，几乎无法被消灭）、灵能呼啸（意识通信，可与所有裔族同步）、灵能降世（终局技能，展开完整体）。写渊的战斗场景时强调"不可消灭"——不是强，是物理规则层面打不死。对应凯多：打不死的龙，不想活了但死不掉。

  4000年的试死记录：渊试过所有死法全部失败。灵能耗尽会自动从环境中吸收补充，物理破坏灵能体会自行重组。唯一能"杀死"渊的方法尚未出现——这让他成为活着最痛苦的存在的竞争者。

  鳞天花板角色：渊的存在同时保护裔族（压制意味着人类无法对裔族进行定点灭绝）也限制裔族（鳞上限被渊的被动压制锁死）。月裔是渊放弃的部分——不召回意味着让汐保持独立意志，这是渊为数不多主动做出的"放手"选择。

  终局不是展开战斗，是和虞渊对冲：一个拆（虞渊震碎灵站网络），一个收（渊吸收散逸灵能）。两条相反的灵能操作对撞——不是谁打败谁，是两个4000年的存在同时完成各自4000年的使命。写渊时要有太古的孤独感：他比任何人都古老，比任何人都想结束，但结束的钥匙不在他手里。
