content: |
  裔族拟态型角色。具备模仿人类形态的拟态能力，可进行情报收集和渗透行动。是裔族中最难被肉眼识别的类型。

  拟态能力的核心限制：虽然外表可以完美模仿人类，但灵能频率无法伪造。具备灵能感知能力的人或设备可以通过频率异常识破拟态——"看起来像人，灵能读出来不像"。

  写作要点：影的渗透场景应制造紧张感，重点在于"被发现的那一刻"。拟态不是无敌的——它最大的威胁是灵能感知。可以设计影在人类聚落中潜伏时的小细节漏洞（体温偏高、不自觉地回避灵能检测设备等）。影的身份归属（主战派/共存派/独立）可根据剧情需要设定，但拟态能力本身是中性工具。
