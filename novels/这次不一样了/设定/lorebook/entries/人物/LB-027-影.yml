content: |
  裔族拟态型，角级。渗透进人类城镇有了身份——安静的杂工。有人跟它打招呼，它喜欢人类的食物。知道焱的计划会摧毁这个城镇，在想怎么通知这些人。兽潮中暴露身份，被它保护的人类杀死——死前没反抗。

  底层驱动：越像人类越想保护这个城镇。拟态能力的讽刺：模仿人类外貌行为越完美，就越理解人类——理解之后就没办法把人类当成"猎物"或"敌人"。影不是"变好了"，是拟态能力本身在改变它的认知方式。

  拟态限制：外表可以完美模仿人类，但灵能频率无法伪造。灵能感知能力的人或设备可以通过频率异常识破——"看起来像人，灵能读出来不像。"体温偏高、不自觉地回避灵能检测设备、偶尔在无意识中做出非人类的小动作（头部微偏、瞳孔短暂竖直），这些都是可以埋的伏笔细节。

  影的死亡是全书最有冲击力的单场景之一：它选择了保护人类，人类选择了杀死它。不是人类恶意——是在兽潮恐慌中，"那个一直安静的杂工"突然暴露了异灵形态，周围人的第一反应是恐惧。影没有反抗，不是不能——是不想。

  写影场景时记住：影的渗透日常要写得温暖平淡——它不是在执行任务，是真的在生活。人类食物的味道、被叫名字时的微小喜悦、下雨天帮忙收衣服——这些细节让它的死更有重量。
