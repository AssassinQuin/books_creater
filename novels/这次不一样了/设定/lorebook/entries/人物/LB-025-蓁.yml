content: |
  裔族巢穴型母体，角级，高繁殖力+幼体感知。对每一个孵出的个体有感情——不是无脑孵化机器。虫豸牙寿命短，大部分在兽潮中被杀。蓁不停失去孩子，不停生新的。巢穴是兽潮补给站——她的爱在喂养战争。

  底层驱动：幼体活下去，不停地生不停地失去。方岩放过它一次因为巢穴有幼体——蓁记住了这个人。它不恨方岩，这种"不恨"在裔族主战派看来是软弱，在蓁看来是"那个两脚兽看到我的孩子没有动手"。

  巢穴是完整生态：母体居中（核心区）→护卫环绕（重装+突击防线）→功能型巡逻（侦察+远程外围）→虫豸外围（散布预警+消耗品）。摧毁巢穴的标准战术：突破外围→消灭护卫→击杀母体。蓁不是战斗型，但它的存在就是族群的命脉——蓁死了，这个族群就没有下一代了。

  写蓁场景时记住：不要给她人类母亲式的温柔——她是异灵，她的"爱"表现为对幼体生存率的精确计算和对危险源的零容忍。巢穴内部应该有温度感（体温维持孵化），和外面冰冷的兽潮战场形成对比。蓁的悲剧不是"孩子死了"，是"我造孩子是为了让他们去死"——但她停不下来，因为停下来就等于族群灭绝。
