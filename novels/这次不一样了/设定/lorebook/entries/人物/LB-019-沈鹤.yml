id: LB-019
name: 沈鹤
keys: [沈鹤, 教会, 祭司, 碑文解读, 认知控制]
secondary_keys: [巡礼祭司, 灵能回响, 教义, 信仰, 质疑]
selective: false
selective_logic: 0
content: |
  教会年轻巡礼祭司，通感级灵能回响感知。他能听到灵能经过之地留下的残余波动——像声音的回音。碑文存在几百年，每一代接触碑文的人都留下情感波动的残余（恐惧/虔诚/怀疑/绝望）。沈鹤能听到这些回响，判断碑文哪些部分被人为打磨过（回响断层）、哪些是原始的（回响连续）——这是他质疑信仰的起源：碑文的文字和回响不匹配，说明文字被改过。

  碑文认知控制的执行者：教会打磨碑文碎片、选择性公布、编成教义。"永恒者将净化一切"从碑文碎片拼出，只是拼错了。沈鹤在用科学方法验证信仰——帮汐翻译碑文是因为汐能验证教义，不是想推翻教义。他真心相信自己在守护信仰，追杀主角团的动机不是"永恒者的敌人"而是主角团发现的碑文真相会摧毁教会的叙事根基，解释权被推翻等于教会崩塌。

  不是纯粹的恶——是半信半疑的信仰者。"查清楚了可能就不信了，不查还有希望。"选择性怀疑比确定不信舒服。他不碰让自己确定不信的证据。V6帮汐翻译时他旁听回响，试图拼出完整真相——但他不是想推翻信仰，是想确认信仰是真的。到结局是"接受信仰可能假但选择信"。

  能力局限：离开灵能遗迹（碑文/古战场/旧灵站）能力几乎没用。零战斗能力。回响信息是情感的不是事实的——能听出"有人恐惧过"但不知道"恐惧什么"。接触碑文时手掌微颤，像在抚摸琴弦感受余震。
