content: |
  研究院病理研究部领导（激进派首席），通感级灵能结构透视（解剖之眼）。他看到的不只是物体表面而是灵能结构——活人在他眼里是一套灵能循环系统（经脉走向/灵能沉积/灵衰症侵蚀位置）。能力让他极度擅长设计实验也让他把人当数据——他直接"看到"灵衰症在血管壁上的沉积模式，自动计算最优实验方案。

  电车难题的执行者：有灵能残渣清除实验方案但缺频率参数。用活体实验（"五和一"）获取数据——五名灵衰症患者推进实验，一人存活产出有效数据。数据真的能救人，被实验的人真会死。他不碰孩子——孩子身上没有灵能沉积，干净的灵能循环系统是他唯一看到"不是数据"的东西。自己的孩子死了，如果他当时会这个能力，会在孩子身上看到什么？他不敢想。

  不是冷血——是世界在他眼里只有数据。他的能力在感知层面就过滤掉了"人的属性"只留下"数据属性"。"拉完拉杆为什么我不难受"才是他真正的恐惧。到结局都不后悔——有些人不是善恶问题，是真心认为代价值得。V14时提供灵能残渣清除技术（与许知许行的频率方程结合），他一直在做正确的事只是用了错误的方式。

  行为模式：学术冷静理性到让人不舒服。对沈念60%数据价值40%善意，不假装纯善也不假装纯研究。分析时瞳孔收缩到极小——在"调焦"看灵能结构层，物理视觉几乎关闭。零战斗能力。
