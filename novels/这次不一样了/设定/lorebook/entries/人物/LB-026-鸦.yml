content: |
  独立个体，不属于裔族任何派系。远感型裔族，能远距离感知灵能频率，是裔族中的"侦察兵"类型。

  鸦的族群——200个远感型个体——被灵枢实验武器一夜消灭。鸦在那一刻感知到了200个灵能频率编码同时消逝的信号，每一个都是它认识的同伴。渊在沉睡中感知到这场灭族灾难，发出4000年来最后一次灵能呼啸。渊为了存储这份灭族记忆，付出了0.7%沉睡质量下降的代价，导致苏醒提前了3年。

  鸦记住了每一个消逝的频率。它的行动完全独立，按自己意志行事，既不追随焱的主战路线，也不认同织的共存方案。

  写作要点：鸦是极为孤独的存在。它的感知能力让它比任何裔族都更清楚灭族的完整过程——不是听到消息，而是一个一个地"听到"同伴消失。渊为它存储记忆的细节暗示了渊与裔族之间超越敌对的关系。鸦的复仇或行动应该是个人化的、精确的，而非泛化的仇恨。
