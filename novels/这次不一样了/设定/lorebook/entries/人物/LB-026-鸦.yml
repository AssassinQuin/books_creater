content: |
  远感型裔族，独立巡猎者，不属于任何派系。V1时是受伤的弱小生物（约T1级），沈念在兽潮废墟中救治了它——包扎伤口喂干粮。沈野不知道这件事。后来鸦感知到主角团被围堵，干扰灵枢信号让他们脱身——善意换善意。V5沈野才知道妹妹救过一个裔族。沈念的原话："它受伤了嘛。"

  底层驱动：追到灭族真相。独自走。靠近任何人都会让它想起——什么都感知到了却救不了。鸦的族群（200个远感型个体）被灵枢实验武器一夜消灭。渊在沉睡中感知到灭族信号，发出4000年来最后一次灵能呼啸，存储了200个死者的存在记录——每存储一个，渊的沉睡质量下降0.7%，苏醒提前了约3年。渊用3年安宁换了200个死者的墓志铭。鸦执着于"记录真相不让任何存在被遗忘"，根源就是这段记忆。

  成长路径：随故事推进持续进化——T1→T3，感知范围不断扩大。中期学会灵能信号干扰，后期感知范围覆盖整座城镇。不是天花板，但足够在关键节点提供决定性情报。

  行为模式：不随主角团行动，独立巡猎追踪灵枢实验遗址。只在感知到致命威胁时出现预警。出现时站在远处高处等人发现，传递完就走，没有告别。从不说名字——叫"拾荒者""守壁人""感知者"。最后叫了沈野名字，唯一一次。紧张或警觉时头部微微偏转——在调整感知方向。

  写鸦场景时记住：鸦是"半块干粮换一次活命"的存在——极度独立极度孤独。它的出场应该有"高处远远看着"的距离感。和沈念的羁绊是全书最安静的感情线之一：沈念不知道自己随手救过的一个生物，会在关键时刻救她哥哥的命。
