content: |
  灵衰症本质是灵能循环系统被灵能残渣堵塞（像血管被胆固醇堵塞）。治疗需要三样东西，缺一不可。

  第一：灵能残渣清除技术。V4铺垫林原检查沈念时说"沉积模式可以压制"，他有清除实验方案但缺频率参数。V8铺垫双星城废墟的公式墙包含许知许行留下的灵能频率清除方程。V14收集时林原数据加许知许行频率方程等于完整清除方案。

  第二：灵能循环结构修复（蔓的编织）。V5铺垫蔓的编织灵能线路和灵衰症患者受损的灵能循环路径很像。V7铺垫蔓编织质变从编物到编灵能本身。V10铺垫蔓的编织域场前兆——能在一定范围内修复灵能结构。V14应用时先清除残渣再编织修复受损循环结构。

  第三：临床经验加患者档案（沈念的贡献）。V4铺垫沈念偷偷复制按产出率排序的灵衰症患者档案。V6铺垫她发现沉积速度和灵能亲和度有关——亲和度高的人反而沉积更快。V9铺垫她对不同阶段灵衰症反应有直觉判断。V14应用时沈念根据患者档案判断受损位置制定个体化方案——她是指挥蔓"往哪编"的人。

  治疗流程：沈念根据患者档案判断受损位置制定方案→林原的频率清除技术清除灵能残渣腾出循环通道→蔓的编织按沈念的方案修复受损结构。没有清除编织修不上，没有编织清除了也白搭，没有沈念的方案不知道该清哪修哪。沈念不是纯受害者——普通人高光，她的临床经验是治疗不可或缺的一环。V4开始三线铺垫，V14汇合闭环。
