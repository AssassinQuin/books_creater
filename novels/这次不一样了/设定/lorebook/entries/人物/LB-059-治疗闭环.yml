id: LB-059
name: 治疗闭环
keys: [治疗闭环, 残渣清除, 循环修复, 编织, 三缺一]
secondary_keys: [林原, 蔓, 许知许行, 频率方程]
selective: false
selective_logic: 0
content: |
  灵衰症本质是灵能循环系统被灵能残渣堵塞。治疗这事说起来不复杂：先把堵着的东西清掉，再把坏掉的结构修好。但做起来每一步都缺关键拼图。

  林原有残渣清除的实验方案但缺频率参数——V4他检查沈念时说过"沉积模式可以压制"。V8双星城废墟的公式墙里找到了许知许行留下的灵能频率清除方程。两边数据凑一起，清除方案才算完整。

  蔓的编织能修复灵能循环结构。V5就铺垫过她的编织灵能线路和灵衰症患者受损的循环路径很像，V7编织质变到能编灵能本身，V10出现了编织域场的前兆。到V14应用时，先清除残渣再编织修复，这条路才真正走通。

  沈念手里有患者档案——V4她偷偷复制了按产出率排序的灵衰症档案，V6发现沉积速度和灵能亲和度有关，V9对不同阶段的灵衰症反应有了直觉判断。到V14她是那个判断"该清哪修哪"的人，指挥蔓往哪个方向编。

  三条线从V4开始各自铺垫，V14汇合。沈念判断位置，林原清除残渣，蔓编织修复。少了任何一环都做不完整——这也是沈念的高光时刻，她的临床经验不是可有可无的，是治疗真正落地不可或缺的那一块。
