content: |
  月裔女孩，波动感知能力（非战斗型情报型），已知唯一能解读远古碑文的人。月裔天然灵能亲和，不需觉醒即可感知灵能频率——这是虞渊四百年来杀了所有人类碑文觉醒者却没杀她的原因：她不在清理名单上。

  翻译碑文靠三个条件：月裔天然亲和（感知频率）+感知刻碑人情绪（理解语气含义）+人类社会经历（懂得人类概念）。碑文是灵能频率编码不是文字，远古文明把历史和情绪一起刻进石头。翻译出来的是碎片，一路拼图——前期碎片拼出"英雄故事"，后期积累够了才揭示"没有英雄全是失败"。最后一块碑底部有封绝遗言："我也以为这次不一样了。"

  碑文认知层（第三层）的危险：每次翻译被微调，灵能频率共振改写读者认知，越来越不像普通人类。研究院测试时的痛苦，渊感知到但没干预——干预等于召回。从V2地下室逃出到V12翻译最后一块碑，翻译能力从碎片到完整拼图。尾声在海边自己立碑用普通文字刻故事——"碑文不应该只有一个人能听"。

  行为模式：笑像孩子，偶尔安静看天发呆（种族的孤独）。模仿人类行为经常搞错（对哭的人说"恭喜"）。碰到碑文时完全安静，眼睛闭手贴碑面——和平时的汐完全不同。口头禅"这是热的。你们的东西很多是热的。为什么？"核心成长：从"疼是正常的"到"原来不一定要疼"。
