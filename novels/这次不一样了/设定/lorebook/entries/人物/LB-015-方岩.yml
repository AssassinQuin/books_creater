content: |
  壁盾军团15年退役斥候，通感级灵能感知地形（极弱，几乎不成长，靠经验弥补）。退役原因：初觉级太弱不够当军官。但15年斥候生涯让他的地形判断/兽潮预判/路线规划比大部分军官都强——能力不是他的武器，经验才是。

  装备：制式短刀（壁盾标配）+修了无数次的灵能罗盘（北境用了15年，V1兽潮中替沈野挡一击后罗盘碎裂）。方岩路线图：V1→V2的16站安全路线，用脚量出来的。每一站他都走过、验证过、知道哪里能补给哪里有兽群痕迹。路线图不是情报——是一个老兵用命换来的生存手册。

  叙事定位"不知道"：12个斥候战友全军覆没（实际是军团高层延迟增援+灵枢控制信息），他以为是自己的判断失误。发现真相后不知道该恨谁——"无处安放的恨"比恨本身更痛苦。温柔也是懦弱：赵铁山选择了不知道，方岩在查但查不清。

  行为模式：短句命令式，偶尔沉默很久。夸人用力拍肩，骂人是关心方式（装备不好会死人）。睡觉睁一只眼，身上无数旧伤。对平民没耐心，对沈念温柔（救过他+像他兽潮中死的4岁女儿）。口头禅"别磨叽""趴下"。秘密：执行过瞒报兽潮频率的命令。
