content: |
  裔族主战派领袖，灵焰龙蜥族群精英，鳞级。深红鳞片覆盖全身，灵焰在鳞缝间持续流动，体型三层楼高。灵焰操控——从口部和鳞缝喷射高密度灵焰，具备指挥低级异灵协同作战的战术智慧。弱点是胸口灵焰核心，唯一无鳞片覆盖的区域。

  底层驱动：先动手才能活——恐惧驱动的先手。它的族群曾被人类军团差点灭族，它记得每一个被杀的同伴。主战立场来自创伤记忆而非渊的布局——"人类不灭，异灵不存。"不是天生的恶，是差点被灭族之后PTSD式的应激反应。

  被灵枢操控而不自知：以为兽潮是自然现象，不知道灵枢通过控制灵晶供应在故意延长战争。灵枢操控裔族进化速度（灵能分配影响），焱以为自己的力量是天赋——其实部分是灵枢故意放任的结果。

  和方岩在边境打过无数次，给方岩留过路——不是仁慈是杀好战士浪费。到死都觉得自己是对的，改不了。创伤只会重复。

  写焱场景时记住：它的台词应该带着被逼到绝境的愤怒和理性计算并存的味道，不是嘶吼而是低沉的肯定句——"他们会来的。他们总是会来的。"和织的共存立场形成裔族内部意识形态对立，但不要简化成善恶之分。
