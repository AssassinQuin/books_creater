content: |
  灵枢运营部外环区区域经理，"平庸之恶"载体。负责12个灵站运营指标。深灰制服，头发整齐，职业化温和笑——视察灵站时穿干净的灰色制服，和排队的人保持三步距离。

  把灵衰症患者当数据管理：称呼排队者为"供应方"不是"人"。发现沈念产出率下降时第一反应不是关心她的病——是考虑是否需要"优化"这个高产出源的档期。签灵站扩容令时手很稳——他真心不觉得自己在做什么错事。"效率就是善良"是他的Lie：灵站让穷人有收入，灵衰症是副作用不是设计缺陷。KPI越高说明越多人有了收入来源。

  不是脸谱化反派：中环普通家庭出身，有个女儿在枢都上学，每周寄灵晶给她买书。不是冷血——是把同情心切分了，留给自己的家人，对灵站的排队者关闭了。共鸣级灵能固化能力（让灵能凝固锁住敌人释放），但灵枢内他不是最会打架的——是最难被搬动的。灵枢需要"定海神针"，他就是那个在政治中同样"凝固"的人。

  弧线：V1灵站出场→V2-3背景存在（"灰色制服"）→V4灵衰症真相揭露时读者会回想起他的脸→V7体系崩塌时他不知道该做什么——他从来没想过灵站之外的世界。他不需要被打败——他只需要被看到。不是每个反派都拔刀，有些反派只是签文件。
