content: |
  灵枢外环猎犬，从追踪高产出源的回收员做到现场指挥官。每一步升迁踩在被他冻住拖回来的人身上。寒霜印记（共鸣级·元素型）：霜痕追踪标记、冰结冻关节、霜域低温控场。外环出身，冬天冻过，手指发紫骨头疼——他把冻刻进灵能里，然后用这份冻去标记别人、冻住别人、拖回别人。

  外观：右耳缺一角（异灵咬的），左颊浅疤（逃跑患者碎玻璃划的），右手永远微微发紫（霜域反噬），指甲下面青色。灰色灵枢制服但不再干净笔挺——袖口磨破，裤腿有血迹冰碴。腰间挂锁链，走路会响。右手冻伤痕迹从手背延伸到指尖。

  把活人翻译成参数然后用冰冻住：亲手调高吸收椅参数，亲手看着灰斑脉冲记录"耐受良好"，亲手冻住逃跑者的膝盖拖三公里拖回灵站。追踪最久的高产出源是沈念（F4#17），她不知道他是谁，他知道她的灰斑到了第几个关节。

  弧线：V1调参数→V2冻人拖人→V3手抖半秒→V4对峙沈野冰结冻脚踝→V5突袭善终所→V6当面崩解→V7女儿死+鱼死网破+霜域崩溃右手永久损伤→带数据走出去→V12-14建预警系统。核心定位：主动选择每次作恶的人，不是被动执行的齿轮。V7女儿灵衰症去世——公式崩塌。

  对话像报告，动作像手术。口头禅："耐受良好。""维持当前频率。""标记已读。"
