content: |
  研究院外勤数据组底层分析师，方岩内线数据源。外环边境小镇平民出身——12岁时小镇被兽潮淹没，被壁盾斥候从废墟刨出来，斥候给了他一个灵能罗盘"跟着指针走，有人接"。凭天赋考进研究院。修了无数次的旧罗盘放在工位最显眼位置——就是当年那个斥候给他的。

  V4关键发现：沈念的灵能残渣沉积模式异常——"不像自然暴露，像长期高频"。埋下灵衰症成因的关键疑点：灵衰症不只是灵站累积副作用，有可能是灵站刻意制造的高频暴露。他只相信数据，但数据涉及中高层时不上报——"报告给谁？中高层就是让这些数据存在的人"。沈念的治疗方案是他私人时间写的，不是院长安排的。

  弧线：V2出场做方岩内部数据源→V2-6持续传加密内线数据→V7研究院内乱失联（被中高层发现泄密）→V14方岩在旧工位找到他的罗盘+坐标纸条确认存活。他以为自己在做小事——其实是整条兽潮线索的关键支点。处理最冷静的数据，做着最危险的事。

  初觉级灵能异常预警（危险直觉）：被动触发，附近灵能出现"不该有的波动"时后颈发凉。够他发现"兽潮预警数据不对"和"灵站参数被篡改"。弱点：他不知道自己有这个能力，以为"后颈发凉"是普通直觉。不敢走出数据的安全区——知道真相但从未亲手阻止任何一件事。
