content: |
  男二，凝相级灵能分解。封绝血脉直系后裔，当代遗脉守护者·守壁人。触碰即崩解灵能结构——是这个世界唯一能拆解灵能本源的能力。分解的本质不是"消除"而是"归还"：把灵能还给封印体系。

  血脉代价：能力太强，当前世界灵能浓度撑不起全力释放，不足部分从生命力补。用一次少活一段，族人代代活不过四十。他不觉得短命值得提——从出生就知道的事，对他来说是"理所当然"。没告诉任何人，不是怕担心，是觉得不值得说。战斗前闭眼深呼吸一次，思考时摩挲虎口旧伤。

  进阶方向：从"分解灵能"进化到"分解灵能造成的效果"——不只是拆结构，是拆结果。禁地关键角色（V10），封印松动原因的追查者。和封绝的镜像：封绝一个人去封印实力不够只封了一半，陆沉有队友配合完成了封绝没完成的事。

  行为模式：闷油瓶，话都在心里不说，做不解释。战斗如入无人之境下了战场连菜都不会点。感动不做表情用行动回应（调巡逻、放干粮枕边），愤怒更沉默分解更暴烈。口头禅"走吧""该做的事"。成长方向：从"无所谓活不活"到"正因为短才要认真"。
