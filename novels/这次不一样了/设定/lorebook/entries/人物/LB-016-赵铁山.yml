content: |
  壁盾军团副军团长→军团长，凝相级体魄共振。灵能不外放全部内循环，和肌肉骨骼产生共振让身体物理性能超越常人极限十倍。拳头没有灵能特效但力量速度是普通人十倍——壁盾"能力者只是厉害点的普通人"的活例子。与灵能武器共鸣效率是普通士兵10倍，一个人能顶一段城墙。

  "交易正义"：正确选择用了错误方式。壁盾与灵枢签武器供应协议——灵枢提供灵能武器，军团不报告兽潮真实频率。他签了。死循环：没有武器守不住，有武器永远打不完。体系崩溃后他带军团独立守边境，没有灵枢武器用老办法打，死伤惨重但手终于干净了——他不觉得是胜利。

  叙事复杂性：道德灰度角色。他不是做错了——在当时的局势下不签协议会有更多人死。他也不是做对了——协议让兽潮真相被掩埋了12年，方岩的12个战友因此全军覆没。"手变干净但代价惨重"就是他的全部弧线。到结局都不后悔当初的选择，有些人就是做了错的选择但永远认为那是对的。

  行为模式：粗犷军事化，骂人是关心方式。对方岩选择"不知道"——最温柔也是最懦弱的事。能和普通士兵用同款武器但打出十倍效果——壁盾新兵看到军团长的武器和自己一模一样，但赵铁山能打出共鸣级效果，因为人和武器之间的共振不同。
