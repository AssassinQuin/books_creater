content: |
  虞渊，约400年寿命，接近灵源级，这个世界灵站网络的实际缔造者。他的灵能震域体系核心不是"控制灵能"，而是"震裂灵能结构"——整张灵站网络就是他用400年一掌一掌震出来的裂缝体系。每天几千次调整灵站参数，连睡觉时震域都在运转。

  外貌标志：身体表面有灵能裂纹（淡金色），情绪越强烈裂纹越亮，全力时全身裂开像一座金色碎雕像。400年来裂纹越来越多越来越深——他在被自己的震域慢慢震碎。写虞渊的外貌时，裂纹是情绪指示器：平静时几乎不可见，暴怒时整个人像要碎裂。

  震频记忆的诅咒：每次使用震域处决目标，受害者碎片中的"最后念头"会在他意识里震几秒。400年累积的死亡记忆没有消退机制——他不是不知道代价，是扛着代价在建体系。写他的残酷场景时要记住：每一个被他震碎的人，最后几秒的意识他都接收到了。

  花是他震域里唯一的安静。花枯了=他彻底变成震频机器，不再有人性残余。走不了回头路不是因为力量，是因为自愿追随者的恩情链条——太多人为他死了，停下等于让他们白死。对应白胡子（震裂一切、站着死、保护家人）+曹操（建体系的枭雄）。

  写虞渊绝对不能写成纯粹的恶。他是"系统本身"——和灵枢一样，停下来就崩溃。终局是他全力震碎自己400年的灵站网络：拆自己建的东西。这不是救赎，是一个建了400年体系的人亲手拆掉它——因为有人证明了有更好的路。
