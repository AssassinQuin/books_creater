name: 沈野能力体系
keys: [沈野, 拓印, 铸造, 双能力, 特殊碎片]
secondary_keys: [铸造, 模拟, 拓印, 碎片]
selective: true
selective_logic: 2
content: |
  双能力觉醒：灵能拓印+灵能铸造（解构灵能的一体两面，不是两个能力）。本质是"解构"——触碰灵能结构拆解为底层模式。第一阶段"模拟"（复制弱化版），第二阶段"铸造"（用理解的模式制造灵能物品）。是裴晗铸造能力的下位替代+罕见双能力突变。自主觉醒，不欠任何人（与人工觉醒形成对比）。

  铸造哲学：不是追求"最强"是"最适合"，弥补每个人短板。团队军火库——为每人定制装备。铸造品有使用次数和素材依赖，拾荒者出身决定素材质量直接决定成品上限。拍手传递机制：铸造碎片拍队友肩膀即可"安装"，队友不需觉醒。他不解释这是什么，拍完就走——用碎片表达关心。

  成长路径：初觉（V1-3拾荒辨别灵能模式+基础装备）→通感（V4-5模拟别人弱化版能力）→凝相（V6-8铸造灵能物品+理解深化）→共鸣（V9复制活人能力+拍手传递）→蜕变（V13组合能力熔铸）。特殊碎片（五层嵌套回路）是V1核心道具，有牵引感+干扰T2核心频率。

  核心限制：永远无法100%理解一个能力→模拟永远是弱化版；素材依赖→好材料好东西差材料勉强能用；铸造消耗精神力→连续铸造后头痛鼻血手抖；不能复制生命型能力（陆沉的分解有血脉代价，模拟的分解没有代价效果也弱得多）。动机全程个人化——治妹妹，不是革命者。
