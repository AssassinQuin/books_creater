<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700;900&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  @page { size: 794px 1123px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 794px; height: 1123px; background: #faf8f6; }
  .cover { position: relative; width: 794px; height: 1123px; background: #faf8f6; font-family: 'Noto Sans SC','Microsoft YaHei',sans-serif; color: #242220; }
  .bg { position: absolute; inset: 0; z-index: 0; background: linear-gradient(160deg, #faf8f6 0%, #f2ede8 50%, #eae4dd 100%); }
  .l1 { position: absolute; z-index: 1; top: 85px; left: 60px; width: 180px; height: 4px; background: #d82442; opacity: 0.8; border-radius: 2px; }
  .l2 { position: absolute; z-index: 1; top: 95px; left: 60px; width: 100px; height: 2px; background: #d82442; opacity: 0.4; border-radius: 1px; }
  .c1 { position: absolute; z-index: 1; bottom: 120px; right: 80px; width: 200px; height: 200px; border: 3px solid #d82442; border-radius: 50%; opacity: 0.06; }
  .c2 { position: absolute; z-index: 1; bottom: 160px; right: 120px; width: 120px; height: 120px; border: 2px solid #d82442; border-radius: 50%; opacity: 0.04; }
  .bar { position: absolute; z-index: 1; bottom: 60px; left: 60px; right: 60px; height: 1px; background: #d82442; opacity: 0.15; }
  .kicker { position: absolute; z-index: 3; top: 120px; left: 60px; font-size: 13px; font-weight: 500; letter-spacing: 4px; color: #d82442; opacity: 0.85; }
  .title { position: absolute; z-index: 3; top: 200px; left: 60px; max-width: 520px; }
  .title h1 { font-family: 'Noto Serif SC', serif; font-size: 42px; font-weight: 900; line-height: 1.3; color: #242220; letter-spacing: 1px; }
  .title .sub { font-size: 18px; font-weight: 300; color: #79746d; line-height: 1.5; margin-top: 16px; }
  .summary { position: absolute; z-index: 3; top: 440px; left: 60px; max-width: 480px; }
  .summary p { font-size: 12.5px; color: #79746d; line-height: 1.8; margin-bottom: 8px; }
  .meta { position: absolute; z-index: 3; bottom: 80px; left: 60px; font-size: 11px; color: #79746d; line-height: 1.8; opacity: 0.7; }
  .data { position: absolute; z-index: 3; top: 200px; right: 60px; display: flex; flex-direction: column; gap: 24px; align-items: flex-end; }
  .data .n { font-family: 'Noto Serif SC', serif; font-size: 36px; font-weight: 900; color: #d82442; line-height: 1; }
  .data .lb { font-size: 11px; color: #79746d; margin-top: 4px; }
</style>
</head>
<body>
<div class="cover">
  <div class="bg"></div>
  <div class="l1"></div><div class="l2"></div><div class="c1"></div><div class="c2"></div><div class="bar"></div>
  <div class="kicker">对局决策手册</div>
  <div class="title">
    <h1>炉石传说<br>标准模式<br>对局决策数学模型</h1>
    <div class="sub">从构筑到对局的完整量化决策体系</div>
  </div>
  <div class="data">
    <div><div class="n">5</div><div class="lb">核心决策模型</div></div>
    <div><div class="n">984</div><div class="lb">标准模式卡牌</div></div>
    <div><div class="n">CPI</div><div class="lb">综合战力指数</div></div>
  </div>
  <div class="summary">
    <p>基于984张标准模式卡牌数据，构建五维决策模型体系：卡牌综合战力指数（CPI）、场面估值函数、交换vs打脸决策、费用曲线优化、起手换牌策略。覆盖从构筑到对局的完整决策链。</p>
  </div>
  <div class="meta">
    数据来源：HearthstoneJSON API (含35.0.3补丁)<br>
    分析范围：大灾变 / 穿越时空 / 失落之城 / 翡翠梦境 / 核心<br>
    生成日期：2026年4月17日
  </div>
</div>
</body>
</html>
