<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  @page{size:794px 1123px;margin:0}
  html,body{width:794px;height:1123px;overflow:visible;background:#f3f1ef;font-family:'Noto Sans SC',sans-serif}
  .cv{position:relative;width:794px;height:1123px;background:#f3f1ef;overflow:hidden}
  .b1{position:absolute;top:-50px;right:-40px;width:380px;height:380px;border-radius:50%;background:rgba(206,54,79,0.05)}
  .b2{position:absolute;bottom:-70px;left:-50px;width:320px;height:320px;border-radius:50%;background:rgba(230,126,34,0.05)}
  .lv{position:absolute;left:80px;top:260px;width:3px;height:380px;background:linear-gradient(to bottom,rgba(206,54,79,0.3),rgba(230,126,34,0.2));border-radius:2px}
  .lh{position:absolute;left:80px;bottom:150px;width:220px;height:2px;background:linear-gradient(to right,rgba(206,54,79,0.2),transparent)}
  .kk{position:absolute;left:110px;top:280px;font-size:13px;color:#807b73;letter-spacing:4px}
  .ht{position:absolute;left:110px;top:320px;width:580px}
  .ht h1{font-size:38px;font-weight:900;color:#242220;line-height:1.4;letter-spacing:1px}
  .ht .a1{color:#ce364f}
  .ht .a2{color:#e67e22}
  .mi{position:absolute;left:110px;top:560px;font-size:13px;color:#807b73;line-height:2.2}
  .st{position:absolute;right:80px;top:280px;display:flex;flex-direction:column;gap:14px}
  .sb{background:rgba(255,255,255,0.85);border:1px solid rgba(0,0,0,0.06);border-radius:8px;padding:14px 18px;text-align:right;min-width:135px}
  .sn{font-size:26px;font-weight:900;line-height:1.2}
  .sn.c1{color:#ce364f}
  .sn.c2{color:#e67e22}
  .sn.c3{color:#3498db}
  .sl{font-size:10px;color:#807b73;margin-top:3px}
  .su{position:absolute;left:110px;bottom:170px;width:560px;font-size:14px;font-weight:300;color:#5a5550;line-height:1.9;border-left:3px solid rgba(206,54,79,0.25);padding-left:16px}
  .ft{position:absolute;left:110px;bottom:60px;font-size:10px;color:#a09b93;letter-spacing:1px}
  .tags{position:absolute;right:80px;bottom:200px;display:flex;gap:8px;flex-wrap:wrap;width:220px;justify-content:flex-end}
  .tag{font-size:10px;padding:4px 10px;border-radius:12px;border:1px solid rgba(0,0,0,0.08);color:#807b73;background:rgba(255,255,255,0.6)}
</style>
</head>
<body>
<div class="cv">
  <div class="b1"></div><div class="b2"></div><div class="lv"></div><div class="lh"></div>
  <div class="kk">UNIFIED KEYWORD MODEL</div>
  <div class="ht">
    <h1>炉石传说标准模式<br><span class="a1">关键词</span>统一<span class="a2">综合模型</span></h1>
  </div>
  <div class="mi">
    2026年4月 | 圣甲虫之年<br>
    35种关键词 | 933次引用 | 973张卡牌<br>
    传统机制 + 11种新机制 完整重构
  </div>
  <div class="st">
    <div class="sb"><div class="sn c1">35</div><div class="sl">关键词种类</div></div>
    <div class="sb"><div class="sn c2">11</div><div class="sl">新机制类型</div></div>
    <div class="sb"><div class="sn c3">973</div><div class="sl">标准卡牌总数</div></div>
  </div>
  <div class="tags">
    <span class="tag">兆示</span><span class="tag">灌注</span><span class="tag">黑暗之赐</span>
    <span class="tag">残骸</span><span class="tag">回溯</span><span class="tag">扰魔</span>
    <span class="tag">奇闻</span><span class="tag">裂变</span><span class="tag">休眠</span>
    <span class="tag">复生</span><span class="tag">延系</span>
  </div>
  <div class="su">
    基于最新标准模式数据，将传统mechanics标签关键词与文本描述新机制统一纳入效率模型。从数量分布、属性效率、六维分类、组合策略、职业特征五大维度完成完整量化重构。
  </div>
  <div class="ft">Z.ai Unified Analysis Report</div>
</div>
</body>
</html>
