<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: 794px 1123px; margin: 0; }
  html, body { width: 794px; height: 1123px; overflow: visible; background: #f3f1ef; font-family: 'Noto Sans SC', sans-serif; }

  .cover {
    position: relative;
    width: 794px;
    height: 1123px;
    background: #f3f1ef;
    overflow: hidden;
  }

  /* Layer 0: Background accents */
  .bg-accent-top {
    position: absolute;
    top: -60px;
    right: -40px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: rgba(206, 54, 79, 0.06);
  }
  .bg-accent-bottom {
    position: absolute;
    bottom: -100px;
    left: -60px;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: rgba(206, 54, 79, 0.04);
  }

  /* Layer 1: Decorative lines */
  .line-left {
    position: absolute;
    left: 80px;
    top: 280px;
    width: 3px;
    height: 320px;
    background: rgba(206, 54, 79, 0.25);
    border-radius: 2px;
  }
  .line-bottom {
    position: absolute;
    left: 80px;
    bottom: 140px;
    width: 200px;
    height: 2px;
    background: rgba(206, 54, 79, 0.15);
  }

  /* Layer 2: Text content */
  .kicker {
    position: absolute;
    left: 110px;
    top: 300px;
    font-size: 14px;
    font-weight: 400;
    color: #807b73;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .hero-title {
    position: absolute;
    left: 110px;
    top: 340px;
    width: 580px;
    font-size: 42px;
    font-weight: 900;
    color: #242220;
    line-height: 1.35;
    letter-spacing: 2px;
  }
  .hero-title .accent { color: #ce364f; }

  .meta-info {
    position: absolute;
    left: 110px;
    top: 610px;
    font-size: 13px;
    color: #807b73;
    line-height: 2;
  }

  .summary-block {
    position: absolute;
    left: 110px;
    bottom: 180px;
    width: 560px;
    font-size: 15px;
    font-weight: 300;
    color: #5a5550;
    line-height: 1.8;
    border-left: 3px solid rgba(206, 54, 79, 0.3);
    padding-left: 16px;
  }

  .footer {
    position: absolute;
    left: 110px;
    bottom: 60px;
    font-size: 11px;
    color: #a09b93;
    letter-spacing: 1px;
  }

  /* Stats badges */
  .stats {
    position: absolute;
    right: 80px;
    top: 300px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .stat-badge {
    background: rgba(255,255,255,0.8);
    border: 1px solid rgba(206, 54, 79, 0.15);
    border-radius: 8px;
    padding: 12px 18px;
    text-align: right;
    min-width: 130px;
  }
  .stat-num {
    font-size: 28px;
    font-weight: 900;
    color: #ce364f;
    line-height: 1.2;
  }
  .stat-label {
    font-size: 11px;
    color: #807b73;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="bg-accent-top"></div>
  <div class="bg-accent-bottom"></div>
  <div class="line-left"></div>
  <div class="line-bottom"></div>

  <div class="kicker">HEARTHSTONE STANDARD FORMAT</div>

  <div class="hero-title">
    炉石传说<br>
    标准模式<br>
    <span class="accent">关键词</span>综合分析
  </div>

  <div class="meta-info">
    2026年4月 / 圣甲虫之年<br>
    基于HearthstoneJSON最新数据
  </div>

  <div class="stats">
    <div class="stat-badge">
      <div class="stat-num">973</div>
      <div class="stat-label">标准卡牌总数</div>
    </div>
    <div class="stat-badge">
      <div class="stat-num">30+</div>
      <div class="stat-label">关键词机制</div>
    </div>
    <div class="stat-badge">
      <div class="stat-num">11</div>
      <div class="stat-label">职业分析</div>
    </div>
  </div>

  <div class="summary-block">
    基于最新标准模式卡牌库，对战吼、亡语、发现、突袭等核心关键词进行数量分布、属性效率、费用结构、职业特征与多关键词组合的五维量化分析，构建关键词策略决策模型。
  </div>

  <div class="footer">Z.ai Data Analysis Report</div>
</div>
</body>
</html>
