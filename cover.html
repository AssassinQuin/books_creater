<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;500;700;900&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  @page { size: 794px 1123px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 794px; height: 1123px; background: #faf8f6; }

  .cover {
    position: relative;
    width: 794px;
    height: 1123px;
    background: #faf8f6;
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    color: #242220;
  }

  /* Layer 0: Background fill */
  .bg-fill {
    position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(160deg, #faf8f6 0%, #f2ede8 50%, #eae4dd 100%);
  }

  /* Layer 1: Decorative elements */
  .deco-line-1 {
    position: absolute; z-index: 1;
    top: 85px; left: 60px;
    width: 180px; height: 4px;
    background: #d82442;
    opacity: 0.8;
    border-radius: 2px;
  }
  .deco-line-2 {
    position: absolute; z-index: 1;
    top: 95px; left: 60px;
    width: 100px; height: 2px;
    background: #d82442;
    opacity: 0.4;
    border-radius: 1px;
  }
  .deco-circle {
    position: absolute; z-index: 1;
    bottom: 120px; right: 80px;
    width: 200px; height: 200px;
    border: 3px solid #d82442;
    border-radius: 50%;
    opacity: 0.06;
  }
  .deco-circle-2 {
    position: absolute; z-index: 1;
    bottom: 160px; right: 120px;
    width: 120px; height: 120px;
    border: 2px solid #d82442;
    border-radius: 50%;
    opacity: 0.04;
  }
  .deco-bar {
    position: absolute; z-index: 1;
    bottom: 60px; left: 60px; right: 60px;
    height: 1px;
    background: #d82442;
    opacity: 0.15;
  }

  /* Layer 2: Content */
  .kicker {
    position: absolute; z-index: 3;
    top: 120px; left: 60px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 4px;
    color: #d82442;
    text-transform: uppercase;
    opacity: 0.85;
  }

  .title-block {
    position: absolute; z-index: 3;
    top: 200px; left: 60px;
    max-width: 520px;
  }
  .title-block h1 {
    font-family: 'Noto Serif SC', serif;
    font-size: 42px;
    font-weight: 900;
    line-height: 1.3;
    color: #242220;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .title-block .subtitle {
    font-size: 18px;
    font-weight: 300;
    color: #79746d;
    line-height: 1.5;
    margin-top: 16px;
  }

  .summary-block {
    position: absolute; z-index: 3;
    top: 440px; left: 60px;
    max-width: 480px;
  }
  .summary-block p {
    font-size: 12.5px;
    font-weight: 400;
    color: #79746d;
    line-height: 1.8;
    margin-bottom: 8px;
  }

  .meta-block {
    position: absolute; z-index: 3;
    bottom: 80px; left: 60px;
    font-size: 11px;
    color: #79746d;
    line-height: 1.8;
    opacity: 0.7;
  }

  .data-highlight {
    position: absolute; z-index: 3;
    top: 200px; right: 60px;
    display: flex; flex-direction: column; gap: 24px;
    align-items: flex-end;
  }
  .data-item {
    text-align: right;
  }
  .data-item .number {
    font-family: 'Noto Serif SC', serif;
    font-size: 36px;
    font-weight: 900;
    color: #d82442;
    line-height: 1;
  }
  .data-item .label {
    font-size: 11px;
    color: #79746d;
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="bg-fill"></div>
  <div class="deco-line-1"></div>
  <div class="deco-line-2"></div>
  <div class="deco-circle"></div>
  <div class="deco-circle-2"></div>
  <div class="deco-bar"></div>

  <div class="kicker">数据分析报告</div>

  <div class="title-block">
    <h1>炉石传说<br>标准模式卡牌<br>对局抉择模型</h1>
    <div class="subtitle">基于数学建模的量化决策分析体系</div>
  </div>

  <div class="data-highlight">
    <div class="data-item">
      <div class="number">984</div>
      <div class="label">标准模式卡牌总数</div>
    </div>
    <div class="data-item">
      <div class="number">0.708</div>
      <div class="label">模型R平方值</div>
    </div>
    <div class="data-item">
      <div class="number">1.53</div>
      <div class="label">每费属性增长系数</div>
    </div>
  </div>

  <div class="summary-block">
    <p>本报告涵盖圣甲虫之年标准模式全部卡牌数据，构建了随从费用-属性线性模型、场面交换收益矩阵、节奏价值模型和流派效率分析框架，为玩家提供一套可量化的对局辅助决策工具。</p>
  </div>

  <div class="meta-block">
    数据来源：HearthstoneJSON API<br>
    分析范围：大灾变 / 穿越时空 / 失落之城 / 翡翠梦境 / 核心<br>
    生成日期：2026年4月16日
  </div>
</div>
</body>
</html>
